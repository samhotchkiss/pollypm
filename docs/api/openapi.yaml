openapi: 3.1.0
# Phase 6 cleanup: removed stale entries for `POST /projects`,
# `POST /projects/{key}/chat`, `POST /projects/{key}/plan`, and the
# `/tasks/{project}/{n}/approve` + `/reject` pair. None were wired in
# `pollypm.web_api.app`. The plan approve/reject flow is tracked
# separately as Phase 3 work. Doctor surface (`/doctor`,
# `/doctor/checks`, `/doctor/report`, `/doctor/run`) is wired in
# `pollypm.web_api.routes.doctor`.
info:
  title: PollyPM Web API
  version: 0.1.0
  summary: HTTP API that lets a separate frontend drive PollyPM.
  description: |
    The PollyPM Web API exposes the same surface the TUI cockpit drives:
    project drilldown, plan review, task triage, inbox replies, and a
    realtime activity feed.

    See [`docs/web-api-spec.md`](../web-api-spec.md) for the design
    rationale, auth model, SSE semantics, and out-of-scope decisions.

    The API is single-user / personal-use. There is no multi-tenant
    auth in v1.

    ## Authentication

    Three credential modes are accepted (see
    [`docs/web-api-spec.md`](../web-api-spec.md) §3 and
    [`docs/web-ui-2065-security-spec.md`](../web-ui-2065-security-spec.md)
    for the full rationale):

    1. **Bearer header** — `Authorization: Bearer <token>` against
       `~/.pollypm/api-token`. Always accepted; canonical mode for
       non-browser clients (cockpit CLI, scripts, curl). Modeled here as
       `bearerAuth`.
    2. **Session cookie** — `pollypm-session=<opaque-session>`, minted
       by `GET /ui/` only when the caller is a loopback peer, a verified
       tailnet peer (with `tailnet_trust_enabled=True`), or already
       presented a valid bearer header. The cookie is signed with the
       current API token, so token rotation invalidates browser sessions.
       Modeled here as `cookieAuth`.
    3. **Credential-free tailnet peer** — accepted only when the server
       was constructed with `tailnet_trust_enabled=True`, which `pm
       serve` auto-sets when `detect_tailscale_ip()` returns a verified
       Tailscale IPv4 and uvicorn binds that interface. Modeled here as
       the empty (no-credential) entry in the global `security` list.

    Default `pm serve` auto-binds the detected Tailscale IPv4 when
    available; otherwise it binds loopback (`127.0.0.1`) only. LAN
    exposure is intentionally unsupported in v0.
  contact:
    name: PollyPM project
    url: https://github.com/swhmm/pollypm/issues
  license:
    name: See repository LICENSE
    url: https://github.com/swhmm/pollypm/blob/main/LICENSE

servers:
  - url: http://{host}:{port}/api/v1
    description: |
      Local `pm serve` instance. Auto-binds the detected Tailscale IPv4
      when available, otherwise loopback (`127.0.0.1`). LAN binds are
      not a supported v0 configuration.
    variables:
      host:
        default: 127.0.0.1
        description: |
          Host pm serve is bound to. Loopback (`127.0.0.1`) when no
          Tailscale interface is detected; otherwise the verified
          tailnet IPv4 returned by `detect_tailscale_ip()`.
      port:
        default: "8765"
        description: Port pm serve is listening on.

# Each entry is an independent way to satisfy auth. The empty `{}`
# entry means "no credential required" — used by the credential-free
# tailnet-peer mode, which the server enforces at runtime (only honored
# when `tailnet_trust_enabled=True`). See the top-level Authentication
# section for the full credential model.
security:
  - bearerAuth: []
  - cookieAuth: []
  - {}

tags:
  - name: Health
    description: Liveness and diagnostic endpoints.
  - name: Projects
    description: Registered project state and project-level actions.
  - name: Tasks
    description: Task list and task-level actions.
  - name: Plans
    description: Structured plan body for review.
  - name: Inbox
    description: Inbox items and threads.
  - name: Events
    description: Realtime audit-log stream.
  - name: Audit
    description: |
      Historical audit-log queries (grep + stats). The streaming
      counterpart lives under the ``Events`` tag at
      ``GET /api/v1/events``.
  - name: Chat
    description: |
      Chat-surface discovery and message history. The discovery endpoint
      enumerates operator/architect/advisor/worker surfaces; the messages
      endpoint paginates each surface's envelope stream.
  - name: Dashboard
    description: |
      Aggregate cockpit / rail state. Read-only snapshot of projects,
      rollup counters, active sessions, recent commits, completed items,
      recent messages, token usage, and account quotas. SSE streaming
      variant (`/dashboard/stream`) ships in a follow-up PR per Phase 2
      §3.2.
  - name: Config
    description: |
      Read-only view of the loaded `PollyPMConfig`. Credential-shaped
      fields (auth tokens, API keys, webhook secrets, anything matching
      the redaction heuristic in `web_api/routes/config.py`) are replaced
      with `"***"` before serialisation. Mutation is deferred to Phase 3
      so config edits stay TOML-first and reviewable.
  - name: Sessions
    description: |
      Sessions admin (Phase 2 §10). Lists every configured session with
      live tmux + heartbeat state (mirror of `pm sessions`), and exposes
      restart / pause / resume actions for one session at a time.
      Per-task worker surfaces live under `Chat` — this surface only
      covers the static launch plan from `[sessions]` config.
  - name: Storage
    description: |
      Read-only ~/.pollypm/ disk-usage report. Mirrors
      `pm storage report --json` (#2040). Prune is CLI-only per the
      Phase 2 spec — no DELETE / POST endpoints here.
  - name: Heartbeats
    description: |
      Per-session supervisor-heartbeat ledger reads. The list endpoint
      returns one latest-tick row per configured session; the detail
      endpoint adds the recent-tick history for one session. Reads go
      through the canonical `pg_heartbeats` facade — same source the
      cockpit and `pm sessions` consume. The SSE stream endpoint
      (Phase 2 §11.1) ships separately.
  - name: Briefings
    description: |
      Briefing types (morning / weekly / plugin-contributed). List
      registered types, render the most recent cached briefing, and
      force-regenerate. Regenerate is sync with a configurable timeout;
      slow providers surface as `504 timeout` per spec §2.7.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness + version info
      description: Public endpoint; does not require authentication.
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
                    schema_version: 1
                    started_at: "2026-05-07T12:00:00Z"

  /doctor:
    get:
      tags: [Health]
      operationId: getDoctor
      summary: Structured pm doctor output
      description: |
        Mirrors the structured JSON output of `pm doctor` (PR #1347).
        Returns each check with status (ok / warn / fail), an actor
        message, and an optional remediation hint.
      responses:
        "200":
          description: Doctor results (200 even when checks fail; consult `overall`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /doctor/checks:
    get:
      tags: [Doctor]
      operationId: listDoctorChecks
      summary: List available doctor checks
      description: |
        Returns the catalog of registered checks (name, category,
        severity). Phase 2 §7.1. The catalog is process-static — restart
        `pm serve` to pick up plugin-contributed checks.
      responses:
        "200":
          description: List of registered checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorChecksResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /doctor/report:
    get:
      tags: [Doctor]
      operationId: getDoctorReport
      summary: Return the last-run doctor report
      description: |
        Returns the most recent in-process doctor report. 404 if no
        run has happened yet — callers should `POST /doctor/run`
        first. Phase 2 §7.1.
      responses:
        "200":
          description: Last-run report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /doctor/run:
    post:
      tags: [Doctor]
      operationId: runDoctor
      summary: Run doctor checks (optionally with --fix)
      description: |
        Runs every registered check or one named check, optionally
        invoking auto-fix afterwards and re-running fixed checks to
        verify post-fix state. Phase 2 §7.1.

        Spec §2.7 long-running budget: the whole run is capped at
        `timeout_seconds` (default 25, max 120); overrun returns
        `504 timeout`.
      parameters:
        - in: query
          name: timeout_seconds
          schema:
            type: number
            minimum: 1
            maximum: 120
            default: 25
          required: false
          description: Wall-clock budget for the run.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoctorRunRequest"
            examples:
              run_all:
                value:
                  fix: false
              single_check_with_fix:
                value:
                  check: pollypm-home-writable
                  fix: true
      responses:
        "200":
          description: Run completed (200 even when checks fail; consult `ok` / `errors`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorRunResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A `fix=true` doctor run is already in progress. The typed
            error code is `in_progress`; the body includes
            `retry_after_seconds` and the response carries a matching
            `Retry-After` header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "504":
          description: Run exceeded the timeout budget; retry with a longer `timeout_seconds`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List registered projects
      parameters:
        - in: query
          name: tracked
          schema: { type: boolean }
          description: When true, returns only `tracked=true` projects.
        - in: query
          name: q
          schema: { type: string }
          description: Filter projects by key, name, path, or persona.
        - in: query
          name: search
          schema: { type: string }
          description: Alias for `q`.
        - in: query
          name: sort
          schema:
            type: string
            enum: [name, inbox_desc, recent, recent_desc, urgency]
          description: Sort projects by name, inbox count, recency, or urgency.
      responses:
        "200":
          description: All registered projects with derived state.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Project drilldown
      description: |
        Returns project state + recent activity + top tasks +
        pending plan-review (if any). One round trip is enough to
        render the cockpit's project drilldown.
      responses:
        "200":
          description: Project drilldown payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDrilldown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{key}/pause:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: pauseProject
      summary: Pause a project (set tracked=false)
      description: |
        Flips `KnownProject.tracked=false` and re-renders the global
        TOML. Idempotent — a second call against an already-paused
        project returns 200 with the same snapshot and skips the disk
        write. `reason` is persisted to the per-project audit log
        (`projects.tracked.set` event) along with the actor and
        timestamp. Clamped to 500 chars.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectReasonRequest"
      responses:
        "200":
          description: Project paused (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /projects/{key}/resume:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: resumeProject
      summary: Resume a project (set tracked=true)
      description: |
        Flips `KnownProject.tracked=true` and re-renders the global
        TOML. Idempotent — a second call against an already-tracked
        project returns 200 with the same snapshot and skips the disk
        write.
      responses:
        "200":
          description: Project resumed (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /projects/{key}/unpause:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: unpauseProject
      summary: Unpause a project (set tracked=true)
      description: |
        Alias for `POST /projects/{key}/resume`. Flips
        `KnownProject.tracked=true` and re-renders the global TOML.
        Idempotent — a second call against an already-tracked project
        returns 200 with the same snapshot and skips the disk write.
      responses:
        "200":
          description: Project unpaused (or already was).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /projects/{key}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: archiveProject
      summary: Archive a project (remove from config)
      description: |
        Removes the project from `config.projects` and re-renders the
        TOML. Source data on disk (the repo itself, audit JSONLs) is
        untouched. Archive is irreversible from the API — subsequent
        `pause`/`resume`/`init-guide` calls 404. Re-onboarding uses
        the CLI's `pm add-project`. `reason` is persisted to the per-
        project audit log (`projects.archive` event) along with the
        actor and timestamp. Clamped to 500 chars.

        Enforces the session→project invariant: if any enabled session
        in `config.sessions` still references this project key the
        request fails with `409 conflict` and `error.message` lists the
        blocking session names. Disable or remove those sessions
        (`pm sessions disable <name>`) and retry.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectReasonRequest"
      responses:
        "200":
          description: Project archived; response carries the operator-facing message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Project is still referenced by one or more enabled sessions.
            `error.message` names the blocking sessions; disable or
            remove them before retrying. Mirrors the CLI guard in
            `pm projects remove`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /projects/{key}/init-guide:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: initProjectGuide
      summary: Seed a project-local role guide
      description: |
        Wraps `pollypm.project_guides.init_project_guide` — writes
        `<project>/.pollypm/project-guides/<role>.md` seeded from the
        built-in template for that role. Without `force=true`, an
        existing guide returns `409 conflict`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitGuideRequest"
      responses:
        "200":
          description: Guide written; response carries the rendered body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitGuideResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{key}/plan:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Plans]
      operationId: getProjectPlan
      summary: Structured plan body for the active plan-review task
      description: |
        Returns the structured plan for the project's active
        `plan_review` task — the one currently sitting at
        `status=review` on the `user_approval` node. Mirrors PR #1408's
        structured output (summary, judgment calls, body,
        critic synthesis).
      parameters:
        - in: query
          name: version
          schema: { type: integer, minimum: 1 }
          description: |
            Optional plan version. Defaults to the active plan. Plan
            history is not stored server-side in v1, so passing a
            version that doesn't match the currently active plan
            returns 404 — only the active version is fetchable.
      responses:
        "200":
          description: Structured plan body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No plan in review for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Projects]
      operationId: kickoffPlan
      summary: Kick off pm project plan (initial or replan)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            examples:
              initial:
                value:
                  kind: initial
              replan:
                value:
                  kind: replan
                  reason: "Approach pivoted; rescoping for the new target."
      responses:
        "202":
          description: Plan kickoff accepted. Subscribe to SSE for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanKickoffAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{key}/chat:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: sendProjectChat
      summary: Send a chat message to the project's PM persona
      description: |
        Replicates the cockpit chat surface. Returns immediately with a
        thread ID; the PM persona's reply lands as audit events on the
        SSE stream and as inbox messages on the thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "202":
          description: Message accepted; persona reply lands asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Aggregate dashboard / cockpit state
      description: |
        Returns the operator's whole-system snapshot — the same shape
        the cockpit rail computes. Read-only and eventually-consistent;
        for sub-second freshness use the deferred `/dashboard/stream`
        SSE channel (Phase 2 §3.2, follow-up PR).

        Per spec §3.3:
        - A daemon-down state is normal — the response carries
          `daemon_status: "down"` with `active_sessions: []` and a 200
          status; it is NOT a 503.
        - A transient pg / work-service outage that breaks the gather
          surfaces as `503 service_unavailable` so clients retry.
        - `?project=<key>` narrows the response to one project. The
          project list and per-project rows (sessions, commits,
          completed items, recent messages) are scoped to that key,
          along with the three project-derived rollup counters
          (`tracked_count`, `open_inbox_count`, `pending_plan_reviews`).
          The four global activity counters (`alert_count`,
          `sweep_count_24h`, `message_count_24h`, `recovery_count_24h`)
          and `daemon_status` remain workspace-wide. See the
          `scoped_fields` array in the response for the authoritative
          enumeration of which fields were narrowed.
      parameters:
        - in: query
          name: project
          schema: { type: string }
          description: Narrow the response to a single project key.
        - in: query
          name: include_token_history
          schema: { type: boolean, default: false }
          description: |
            Include `daily_tokens` (last 30 days as `[date, tokens]`
            pairs). Off by default — the list can be large.
        - in: query
          name: include_briefing
          schema: { type: boolean, default: false }
          description: |
            Include the morning-briefing narrative in the response.
            Off by default — the body can be megabytes.
      responses:
        "200":
          description: Aggregate dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            Backing-store / gather failure (`service_unavailable`).
            Distinct from a daemon-down state, which is returned as a
            200 response with `daemon_status: "down"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"


  /chat/sessions:
    get:
      tags: [Chat]
      operationId: listChatSessions
      summary: Discover every chat surface (operator/architect/advisor/worker)
      description: |
        Lists every registered chat surface — the operator session, each
        architect/advisor persona configured for a project, and any
        per-task worker sessions known to the work service. Surfaces
        always carry their tmux window state so the cockpit can decide
        whether to subscribe to live capture or pull from the JSONL
        archive. Workers are best-effort: a transient work-service
        outage degrades to "configured surfaces only" rather than 500.
      responses:
        "200":
          description: List of chat surfaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /chat/{session_name}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatSessionName"
    get:
      tags: [Chat]
      operationId: getChatMessages
      summary: Paginated message history for one chat surface
      description: |
        Returns the envelope stream for a single chat surface, sourced
        from the normalized `events.jsonl` archive with optional tmux
        capture fallback. `source=auto` (the default) prefers the
        archive and falls back to live capture when the archive is
        stale (>60s) or missing; `source=jsonl` forces archive reads
        and 404s when the archive isn't on disk; `source=capture` is
        strict — missing windows / unavailable tmux / capture failures
        all 503 with a typed error code instead of returning an empty
        page.
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: ISO-8601 lower bound on message timestamp.
        - in: query
          name: since_id
          schema: { type: string }
          description: |
            Return messages strictly after this id in the requested
            direction. Use the `next_cursor` field from the previous
            response. The cursor is applied AFTER sort+direction so
            pagination is stable for both `asc` and `desc`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Max envelopes per page (capped at 500).
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Ordering — `desc` (newest first, default) or `asc`.
        - in: query
          name: include_subagents
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When `true`, each `subagent_result` envelope on the page
            is enriched with `metadata.subagent_transcript` — a list
            of envelopes parsed from the raw Claude JSONL the parent
            `task-notification.output-file` points at. Paths are
            constrained to project + workspace transcript roots; any
            `output_file` outside the allowlist is silently skipped
            (no inlining, no error) so a malformed transcript cannot
            stat arbitrary files. Inlining is capped per envelope to
            keep response sizes bounded; callers needing the full
            subagent transcript should query its own session via
            `/api/v1/chat/sessions`. See issue #2052.
        - in: query
          name: include_thinking
          required: false
          schema:
            type: boolean
            default: false
          description: |
            When `true`, Anthropic extended-thinking blocks are emitted
            as `type=thinking` envelopes alongside the normal turns.
            Default `false` preserves the historical envelope contract
            so existing clients see no new types unless they opt in.
            See issues #2048 / #2082.
        - in: query
          name: source
          schema:
            type: string
            enum: [auto, jsonl, capture]
            default: auto
          description: |
            Transcript source. `auto` = JSONL with capture fallback
            when stale, `jsonl` = force archive (404 if absent),
            `capture` = force tmux capture (503 on any failure).
      responses:
        "200":
          description: Page of envelopes for this surface.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Unknown session (`session_unknown`) or archive missing
            when `source=jsonl` is explicit (`archive_missing`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: |
            Capture path failure when `source=capture` is explicit:
            `window_missing` (tmux window not running),
            `capture_unavailable` (tmux client not installed),
            `capture_failed` (capture call raised). Also emitted when
            a per-task worker lookup races a work-service outage
            (`service_unavailable`) — distinct from the 404
            `session_unknown` that fires when the surface genuinely
            isn't registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/{session_name}/send:
    parameters:
      - $ref: "#/components/parameters/ChatSessionName"
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Send a message to a chat surface
      description: |
        Push text into the running CLI agent backing
        `session_name` via `tmux send-keys`. Resolves the surface
        through `enumerate_chat_surfaces` — operator / architect /
        advisor sessions come from `config.sessions`; per-task
        workers are validated against active
        `WorkService.list_worker_sessions` rows.

        Safety gates (spec §4.1 / §4.3):

        - **Mid-tool**: rejects when the resolved transcript's tail
          shows an unmatched `tool_use_id` from the current
          assistant response. Tool-only assistant turns (no preface
          text) are caught via the `user_turn` boundary anchor.
        - **Mid-stream**: rejects when the pg heartbeat for
          `session_name` is < 2 s old.

        `safety=strict` (default) enforces both gates and fails
        closed when the resolver cannot fingerprint a transcript to
        the requested surface. `safety=loose` keeps the mid-tool
        gate but allows mid-stream sends, emitting an
        `X-PollyPM-Warning: agent-may-be-streaming` response header.
        `safety=force` bypasses the mid-tool / mid-stream /
        missing-transcript safety gates only. Pane and window
        existence + liveness errors (`409 pane_invalid`,
        `409 pane_dead`, `503 window_missing`,
        `503 tmux_unavailable`) are NOT bypassed and will still
        fail-closed.

        AskUserQuestion replies: when `answer_to` references an
        `ask_user` envelope, `selections[]` must match one of the
        question's option labels exactly; `notes` are appended
        after the selections joined by newlines.
      parameters:
        - in: query
          name: safety
          schema:
            type: string
            enum: [strict, loose, force]
          description: |
            Optional query-string safety override. When present, this
            takes precedence over the JSON body `safety` field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSendRequest"
      responses:
        "200":
          description: |
            Message sent. One of the following `X-PollyPM-Warning`
            values may be present when `safety=loose` allowed the send
            past a gate whose signal was either confirmed-streaming or
            unavailable:

            - `agent-may-be-streaming` — heartbeat < 2 s old.
            - `heartbeat-unavailable` — pg / heartbeat lookup failed
              (loose-mode best-effort; strict-mode 409s instead).
            - `transcript-unavailable` — events.jsonl tail read failed
              (loose-mode best-effort; strict-mode 409s instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSendResponse"
          headers:
            X-PollyPM-Warning:
              description: |
                Set when `safety=loose` allowed a send past a gate that
                would otherwise block (strict mode) or that could not be
                evaluated (best-effort fallback). One of:

                - `agent-may-be-streaming` — heartbeat indicated
                  mid-stream (< 2 s old); loose bypassed it.
                - `heartbeat-unavailable` — pg / heartbeat reader
                  raised; loose continued without the signal. Strict
                  mode would have returned `409 unsafe_unavailable_heartbeat`.
                - `transcript-unavailable` — events.jsonl tail couldn't
                  be read (permissions, IO error, decode failure); loose
                  continued without the mid-tool signal. Strict mode
                  would have returned `409 unsafe_unavailable_transcript`.

                Absent on strict sends (those fail closed instead).
              schema:
                type: string
                enum:
                  - agent-may-be-streaming
                  - heartbeat-unavailable
                  - transcript-unavailable
        "400":
          description: |
            Typed `invalid_request`, `answer_to_missing`,
            `selections_no_question`, or `selections_invalid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `session_unknown` — `session_name` is not in
            `config.sessions` and (for `task-{project}-{N}`) has no
            active worker-session record. Distinguished from
            `503 service_unavailable`, which is returned when the
            worker-service lookup itself fails for a worker-pattern
            name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Typed safety-gate or pane failures:

            - `unsafe_mid_tool` — agent's latest assistant response has
              an unmatched `tool_use_id`, or the transcript resolver
              couldn't fingerprint an exact archive while other
              archives exist for the project.
            - `unsafe_mid_stream` — heartbeat < 2 s old (strict).
            - `unsafe_unavailable_transcript` — strict mode and the
              events.jsonl tail read failed (permissions, IO error,
              decode failure). Loose mode continues with
              `X-PollyPM-Warning: transcript-unavailable`; force mode
              ignores.
            - `unsafe_unavailable_heartbeat` — strict mode and the
              pg heartbeat lookup raised (import / `latest_heartbeat`
              failure / malformed timestamp). Loose mode continues
              with `X-PollyPM-Warning: heartbeat-unavailable`; force
              mode ignores. A missing heartbeat row (no record yet)
              is NOT unavailable — that's the genuine "not streaming"
              signal and the send proceeds.
            - `pane_dead` — target pane is `pane_dead=1` in tmux.
            - `pane_invalid` — requested `pane` index is < 0, not
              present on the window, or the `list-panes` probe failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            Typed backing-store / process failures:

            - `window_missing` — the session is registered but its
              tmux window is not running (including the race where the
              window disappears between validation and `send-keys`).
            - `tmux_unavailable` — tmux binary missing or the tmux
              server timed out / is unreachable.
            - `send_failed` — generic `send-keys` failure (subprocess
              error, paste-buffer load failure).
            - `service_unavailable` — worker-session lookup failed for
              a `task-{project}-{N}` send (work-service open or
              `list_worker_sessions` raised). Distinct from
              `404 session_unknown`, which means the worker definitely
              isn't registered. Retry once the work-service backing
              store is reachable (Codex #2043 review v5 blocker 3 +
              v6 blocker 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{key}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List tasks for a project
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TaskStatus"
          description: Filter by `work_status`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor from a previous response's `next_cursor`.
      responses:
        "200":
          description: Page of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Flat list of tasks across all projects
      description: |
        Cross-project flat task list (spec §5.1). The per-project list
        at `/projects/{key}/tasks` keeps its narrow contract; this
        endpoint exists so a single round trip can populate cross-
        project surfaces (cockpit dashboards, web UI task board).
        Pagination matches the per-project list (opaque `cursor` +
        `next_cursor`); filters are stackable.
      parameters:
        - in: query
          name: project
          schema: { type: string }
          description: |
            Limit results to this project key. By default this still
            respects the tracked-project scope; pass
            `include_untracked=true` to read rows for a project key
            that exists in the backing store but is outside the
            tracked set.
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TaskStatus"
          description: |
            Filter by `work_status`. Repeatable — pass `status=draft&status=queued`
            to OR multiple statuses.
        - in: query
          name: assignee
          schema: { type: string }
          description: Filter by assignee (exact match).
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: |
            ISO-8601 lower bound on `updated_at`. Only tasks whose
            `updated_at` is strictly after this value are returned.
        - in: query
          name: include_untracked
          schema: { type: boolean, default: false }
          description: |
            Include task rows for projects outside the tracked-project
            set. Defaults to false so existing dashboards stay scoped.
            When false and matching rows are omitted, the response
            includes a `warnings[]` entry with
            `code=untracked_filtered` and `dropped_count`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor from a previous response's `next_cursor`.
      responses:
        "200":
          description: |
            Page of task summaries. The optional `warnings` array
            lists any projects whose backing store failed during this
            request and any tracked-scope filtering that omitted
            matching task rows — clients should surface that to the
            operator rather than treat a 200 with warnings as a
            complete read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          description: |
            `invalid_request` — a query parameter was rejected.
            Includes:
              - `since` malformed or missing a timezone offset
                (task `updated_at` values are tz-aware; a naive
                `since` would compare-error to a 500).
              - `cursor` is stale (the item it referenced has been
                updated or deleted). Restart paging without the
                `cursor` parameter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{project}/{n}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Task detail
      description: |
        Full task record — status, current node, executions,
        transitions, plan content (when this task is a plan task).
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      operationId: patchTask
      summary: Selective task edits (labels, status, metadata)
      description: |
        Partial update — every field is optional. Lists replace, not
        merge (spec §5.4). `metadata` is stored as the task's
        `external_refs` map.

        **PATCH cannot combine `status` with other fields.** Requests
        that send `status` together with `labels` or `metadata` are
        rejected with `400 invalid_request` BEFORE any write occurs.
        This narrows the contract so each PATCH is naturally atomic:
        a status-only PATCH routes through the work-service lifecycle
        method (`queued` → `svc.queue`, `cancelled` → `svc.cancel`)
        as a single transaction, and a field-only PATCH (labels
        and/or metadata) lands in one `svc.update(...)` call. The
        combined shape was racy under concurrent writers — a status
        flip between the preflight and the lifecycle call could
        leave labels committed while the status write 409'd
        (#2064 round-2).

        Clients that need to change status alongside other fields
        must send separate PATCH requests, or use the dedicated
        status endpoints (`/queue`, `/cancel`, `/reopen`, `/claim`,
        `/reassign`). `status` values without a direct PATCH→lifecycle
        map (e.g. `in_progress`, `review`) raise `422
        validation_error` with a hint pointing to the dedicated
        transition endpoint.

        `Idempotency-Key` and `If-Match` are intentionally NOT
        accepted — no replay cache or version-token enforcement
        exists yet (#2064, mirrors #2060).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
      responses:
        "200":
          description: Edit applied; response carries the post-edit
            task snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/queue:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: queueTask
      summary: Queue a draft task for execution
      description: |
        `Idempotency-Key` is intentionally NOT accepted — no replay
        cache exists yet (#2064 round-1, mirrors #2060).
      responses:
        "200":
          description: Task transitioned `draft` → `queued`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/claim:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: claimTask
      summary: Atomically claim a queued task
      description: |
        Advances the task to the start (or current) node, keeps
        `assignee` role-derived, and records the request `actor` as
        `claimed_by_session` for session-level claim forensics.
        Refuses non-queued tasks with `409
        invalid_state`. Refuses claims that would exceed the
        project's `max_parallel_workers` ceiling with `429
        worker_cap_exceeded` (#2064 round-11) — normal back-pressure
        the client should retry once an existing worker finishes.
        `Idempotency-Key` and `If-Match` are intentionally NOT
        accepted — no replay cache or version-token enforcement
        exists yet (#2064 round-1, mirrors #2060).

        The response message reflects the actual post-claim state:
        if a post-commit worker-cap race rolls the DB transition
        back to `queued`, the envelope's `message` says "rolled
        back" and `warnings` describes the recovery path (#2064
        round-11 blocker #2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClaimRequest"
      responses:
        "200":
          description: Claim recorded; task is now `in_progress` (or
            `review` for a review-start node). Status may instead
            read `queued` if a post-commit cap-race rolled the
            transition back — clients route on `task.work_status`
            and surface `warnings[]`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: |
            Worker cap exceeded — the project already has
            `max_parallel_workers` active worker sessions. Body
            uses error code `worker_cap_exceeded`. Retry after a
            worker finishes, or raise the cap in `pollypm.toml`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/cancel:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Cancel a non-terminal task
      description: |
        Moves any non-terminal task to `cancelled` and emits the
        cancel-cascade (dependents get an `_on_cancelled` breadcrumb).
        Cancelling an `in_progress` task without `force=true` returns
        `409 confirmation_required` so clients must confirm the active
        worker interruption explicitly. `force=true` is the automation
        escape hatch after that confirmation.
        Cancelling a terminal (done/cancelled) task returns `409
        invalid_state`. `Idempotency-Key` and `If-Match` are
        intentionally NOT accepted — no replay cache or version-token
        enforcement exists yet (#2064 round-1, mirrors #2060).
      parameters:
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Confirm cancellation of an in-progress task.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCancelRequest"
      responses:
        "200":
          description: Task transitioned to `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/reopen:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: reopenTask
      summary: Reopen a cancelled task
      description: |
        Moves a `cancelled` task back to `queued`, clears the live
        assignee/current-node claim fields, and preserves history in
        `work_transitions`. Any active node execution is abandoned so
        the next claim starts a fresh visit instead of reusing stale
        in-flight state.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReopenRequest"
      responses:
        "200":
          description: Task transitioned to `queued`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/release:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: releaseTask
      summary: Release an active worker claim
      description: |
        Moves an active worker-owned task (`in_progress` or `rework`)
        back to `queued` for recovery from stale or accidental
        claims. The flow `current_node_id` is preserved so the next
        claim resumes the same node with a fresh execution visit;
        `assignee` and `claimed_by_session` are cleared, active node
        executions are marked `abandoned`, and a transition/audit row
        records the release reason. Completed/cancelled tasks return
        `409 invalid_state`.

        `Idempotency-Key` and `If-Match` are intentionally NOT
        accepted — no replay cache or version-token enforcement
        exists yet (#2064 round-1, mirrors #2060).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReleaseRequest"
      responses:
        "200":
          description: Task released back to `queued`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # Lifecycle REST verbs (#2137) — done / approve / hold / rework /
  # block / review / in_progress. Each mirrors the existing
  # claim/cancel/reopen/release pattern: typed envelope on success
  # (`TaskActionResult`), 404 for unknown project/task, 409
  # `invalid_state` for illegal transitions, 422 for body / argument
  # validation, 503 for backing-store outage.

  /tasks/{project}/{n}/done:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: doneTask
      summary: Force a task to done (operator bypass)
      description: |
        Maps to `PgWorkService.mark_done` — moves the task directly to
        `done` without running the flow's `node_done` path. The
        flow-respecting variant (`pm task done` with `--output`) is
        the canonical worker hand-off; this endpoint is the Web UI
        operator gesture for "mark this task done" without supplying
        a `work_output` payload (#2137).

        Terminal tasks (`done` / `cancelled`) raise
        `409 invalid_state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDoneRequest"
      responses:
        "200":
          description: Task transitioned to `done`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: approveTask
      summary: Approve a review-state task
      description: |
        Maps to `PgWorkService.approve`. Advances the review node to
        `next_node`; if the target is terminal the task becomes
        `done` and the cancel-cascade fires for dependents. Refuses
        non-review tasks with `409 invalid_state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskApproveRequest"
      responses:
        "200":
          description: Task approved at the current review node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /tasks/{project}/{n}/hold:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: holdTask
      summary: Move a task to on_hold
      description: |
        Maps to `PgWorkService.hold`. Legal from
        `in_progress` / `rework` / `review` / `queued`; other states
        return `409 invalid_state`. Use `/in_progress` to bring a held
        task back into work (`/in_progress` routes through the work
        service's transition guard).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskHoldRequest"
      responses:
