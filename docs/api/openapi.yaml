openapi: 3.1.0
info:
  title: PollyPM Web API
  version: 0.1.0
  summary: HTTP API that lets a separate frontend drive PollyPM.
  description: |
    The PollyPM Web API exposes the same surface the TUI cockpit drives:
    project drilldown, plan review, task triage, inbox replies, and a
    realtime activity feed.

    See [`docs/web-api-spec.md`](../web-api-spec.md) for the design
    rationale, auth model, SSE semantics, and out-of-scope decisions.

    The API is single-user / personal-use. There is no multi-tenant
    auth in v1.
  contact:
    name: PollyPM project
    url: https://github.com/swhmm/pollypm/issues
  license:
    name: See repository LICENSE
    url: https://github.com/swhmm/pollypm/blob/main/LICENSE

servers:
  - url: http://{host}:{port}/api/v1
    description: Local pm serve instance (loopback by default)
    variables:
      host:
        default: 127.0.0.1
        description: Host pm serve is bound to.
      port:
        default: "8765"
        description: Port pm serve is listening on.

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Liveness and diagnostic endpoints.
  - name: Projects
    description: Registered project state and project-level actions.
  - name: Tasks
    description: Task list and task-level actions.
  - name: Plans
    description: Structured plan body for review.
  - name: Inbox
    description: Inbox items and threads.
  - name: Events
    description: Realtime audit-log stream.
  - name: Chat
    description: |
      Chat-surface discovery and message history. The discovery endpoint
      enumerates operator/architect/advisor/worker surfaces; the messages
      endpoint paginates each surface's envelope stream.
  - name: Dashboard
    description: |
      Aggregate cockpit / rail state. Read-only snapshot of projects,
      rollup counters, active sessions, recent commits, completed items,
      recent messages, token usage, and account quotas. SSE streaming
      variant (`/dashboard/stream`) ships in a follow-up PR per Phase 2
      §3.2.

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness + version info
      description: Public endpoint; does not require authentication.
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    version: 0.1.0
                    schema_version: 1
                    started_at: "2026-05-07T12:00:00Z"

  /doctor:
    get:
      tags: [Health]
      operationId: getDoctor
      summary: Structured pm doctor output
      description: |
        Mirrors the structured JSON output of `pm doctor` (PR #1347).
        Returns each check with status (ok / warn / fail), an actor
        message, and an optional remediation hint.
      responses:
        "200":
          description: Doctor results (200 even when checks fail; consult `overall`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List registered projects
      parameters:
        - in: query
          name: tracked
          schema: { type: boolean }
          description: When true, returns only `tracked=true` projects.
      responses:
        "200":
          description: All registered projects with derived state.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Projects]
      operationId: registerProject
      summary: Register a new project
      description: Mirrors `pm add-project`. Idempotent on `path`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProjectRequest"
            examples:
              minimal:
                value:
                  path: /Users/me/dev/myrepo
              full:
                value:
                  path: /Users/me/dev/myrepo
                  name: My Project
                  slug: myproj
                  tracked: true
      responses:
        "201":
          description: Project registered (or returned if already present at path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /projects/{key}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Project drilldown
      description: |
        Returns project state + recent activity + top tasks +
        pending plan-review (if any). One round trip is enough to
        render the cockpit's project drilldown.
      responses:
        "200":
          description: Project drilldown payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDrilldown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /projects/{key}/plan:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Plans]
      operationId: getProjectPlan
      summary: Structured plan body for the active plan-review task
      description: |
        Returns the structured plan for the project's active
        `plan_review` task — the one currently sitting at
        `status=review` on the `user_approval` node. Mirrors PR #1408's
        structured output (summary, judgment calls, body,
        critic synthesis).
      parameters:
        - in: query
          name: version
          schema: { type: integer, minimum: 1 }
          description: |
            Optional plan version. Defaults to the active plan. Plan
            history is not stored server-side in v1, so passing a
            version that doesn't match the currently active plan
            returns 404 — only the active version is fetchable.
      responses:
        "200":
          description: Structured plan body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No plan in review for this project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Projects]
      operationId: kickoffPlan
      summary: Kick off pm project plan (initial or replan)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            examples:
              initial:
                value:
                  kind: initial
              replan:
                value:
                  kind: replan
                  reason: "Approach pivoted; rescoping for the new target."
      responses:
        "202":
          description: Plan kickoff accepted. Subscribe to SSE for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanKickoffAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /projects/{key}/chat:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    post:
      tags: [Projects]
      operationId: sendProjectChat
      summary: Send a chat message to the project's PM persona
      description: |
        Replicates the cockpit chat surface. Returns immediately with a
        thread ID; the PM persona's reply lands as audit events on the
        SSE stream and as inbox messages on the thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "202":
          description: Message accepted; persona reply lands asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Aggregate dashboard / cockpit state
      description: |
        Returns the operator's whole-system snapshot — the same shape
        the cockpit rail computes. Read-only and eventually-consistent;
        for sub-second freshness use the deferred `/dashboard/stream`
        SSE channel (Phase 2 §3.2, follow-up PR).

        Per spec §3.3:
        - A daemon-down state is normal — the response carries
          `daemon_status: "down"` with `active_sessions: []` and a 200
          status; it is NOT a 503.
        - A transient pg / work-service outage that breaks the gather
          surfaces as `503 service_unavailable` so clients retry.
        - `?project=<key>` narrows the project list, rollup counters,
          and the per-project rows (commits, sessions, messages) to
          one project — useful for the per-project drilldown view.
      parameters:
        - in: query
          name: project
          schema: { type: string }
          description: Narrow the response to a single project key.
        - in: query
          name: include_token_history
          schema: { type: boolean, default: false }
          description: |
            Include `daily_tokens` (last 30 days as `[date, tokens]`
            pairs). Off by default — the list can be large.
        - in: query
          name: include_briefing
          schema: { type: boolean, default: false }
          description: |
            Include the morning-briefing narrative in the response.
            Off by default — the body can be megabytes.
      responses:
        "200":
          description: Aggregate dashboard snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            Backing-store / gather failure (`service_unavailable`).
            Distinct from a daemon-down state, which is returned as a
            200 response with `daemon_status: "down"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/sessions:
    get:
      tags: [Chat]
      operationId: listChatSessions
      summary: Discover every chat surface (operator/architect/advisor/worker)
      description: |
        Lists every registered chat surface — the operator session, each
        architect/advisor persona configured for a project, and any
        per-task worker sessions known to the work service. Surfaces
        always carry their tmux window state so the cockpit can decide
        whether to subscribe to live capture or pull from the JSONL
        archive. Workers are best-effort: a transient work-service
        outage degrades to "configured surfaces only" rather than 500.
      responses:
        "200":
          description: List of chat surfaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /chat/{session_name}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatSessionName"
    get:
      tags: [Chat]
      operationId: getChatMessages
      summary: Paginated message history for one chat surface
      description: |
        Returns the envelope stream for a single chat surface, sourced
        from the normalized `events.jsonl` archive with optional tmux
        capture fallback. `source=auto` (the default) prefers the
        archive and falls back to live capture when the archive is
        stale (>60s) or missing; `source=jsonl` forces archive reads
        and 404s when the archive isn't on disk; `source=capture` is
        strict — missing windows / unavailable tmux / capture failures
        all 503 with a typed error code instead of returning an empty
        page.
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
          description: ISO-8601 lower bound on message timestamp.
        - in: query
          name: since_id
          schema: { type: string }
          description: |
            Return messages strictly after this id in the requested
            direction. Use the `next_cursor` field from the previous
            response. The cursor is applied AFTER sort+direction so
            pagination is stable for both `asc` and `desc`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
          description: Max envelopes per page (capped at 500).
        - in: query
          name: direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Ordering — `desc` (newest first, default) or `asc`.
        - in: query
          name: include_subagents
          required: false
          schema:
            type: boolean
            default: false
          description: |
            DEFERRED (#2052). The runtime accepts this parameter for
            forward-compat with the v3 inliner, but currently returns
            `422 validation_error` when set to `true`. The v3
            implementation called `parse_events_jsonl` on the raw
            Claude task-notification `metadata.output_file`, which is
            a different JSONL shape than the normalized archive the
            parser consumes; re-implementation is tracked in #2052.
            Pass `false` (or omit) until the resolver lands.
        - in: query
          name: source
          schema:
            type: string
            enum: [auto, jsonl, capture]
            default: auto
          description: |
            Transcript source. `auto` = JSONL with capture fallback
            when stale, `jsonl` = force archive (404 if absent),
            `capture` = force tmux capture (503 on any failure).
      responses:
        "200":
          description: Page of envelopes for this surface.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Unknown session (`session_unknown`) or archive missing
            when `source=jsonl` is explicit (`archive_missing`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: |
            Capture path failure when `source=capture` is explicit:
            `window_missing` (tmux window not running),
            `capture_unavailable` (tmux client not installed),
            `capture_failed` (capture call raised). Also emitted when
            a per-task worker lookup races a work-service outage
            (`service_unavailable`) — distinct from the 404
            `session_unknown` that fires when the surface genuinely
            isn't registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /chat/{session_name}/send:
    parameters:
      - $ref: "#/components/parameters/ChatSessionName"
    post:
      tags: [Chat]
      operationId: sendChatMessage
      summary: Send a message to a chat surface
      description: |
        Push text into the running CLI agent backing
        `session_name` via `tmux send-keys`. Resolves the surface
        through `enumerate_chat_surfaces` — operator / architect /
        advisor sessions come from `config.sessions`; per-task
        workers are validated against active
        `WorkService.list_worker_sessions` rows.

        Safety gates (spec §4.1 / §4.3):

        - **Mid-tool**: rejects when the resolved transcript's tail
          shows an unmatched `tool_use_id` from the current
          assistant response. Tool-only assistant turns (no preface
          text) are caught via the `user_turn` boundary anchor.
        - **Mid-stream**: rejects when the pg heartbeat for
          `session_name` is < 2 s old.

        `safety=strict` (default) enforces both gates and fails
        closed when the resolver cannot fingerprint a transcript to
        the requested surface. `safety=loose` keeps the mid-tool
        gate but allows mid-stream sends, emitting an
        `X-PollyPM-Warning: agent-may-be-streaming` response header.
        `safety=force` bypasses the mid-tool / mid-stream /
        missing-transcript safety gates only. Pane and window
        existence + liveness errors (`409 pane_invalid`,
        `409 pane_dead`, `503 window_missing`,
        `503 tmux_unavailable`) are NOT bypassed and will still
        fail-closed.

        AskUserQuestion replies: when `answer_to` references an
        `ask_user` envelope, `selections[]` must match one of the
        question's option labels exactly; `notes` are appended
        after the selections joined by newlines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSendRequest"
      responses:
        "200":
          description: |
            Message sent. One of the following `X-PollyPM-Warning`
            values may be present when `safety=loose` allowed the send
            past a gate whose signal was either confirmed-streaming or
            unavailable:

            - `agent-may-be-streaming` — heartbeat < 2 s old.
            - `heartbeat-unavailable` — pg / heartbeat lookup failed
              (loose-mode best-effort; strict-mode 409s instead).
            - `transcript-unavailable` — events.jsonl tail read failed
              (loose-mode best-effort; strict-mode 409s instead).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSendResponse"
          headers:
            X-PollyPM-Warning:
              description: |
                Set when `safety=loose` allowed a send past a gate that
                would otherwise block (strict mode) or that could not be
                evaluated (best-effort fallback). One of:

                - `agent-may-be-streaming` — heartbeat indicated
                  mid-stream (< 2 s old); loose bypassed it.
                - `heartbeat-unavailable` — pg / heartbeat reader
                  raised; loose continued without the signal. Strict
                  mode would have returned `409 unsafe_unavailable_heartbeat`.
                - `transcript-unavailable` — events.jsonl tail couldn't
                  be read (permissions, IO error, decode failure); loose
                  continued without the mid-tool signal. Strict mode
                  would have returned `409 unsafe_unavailable_transcript`.

                Absent on strict sends (those fail closed instead).
              schema:
                type: string
                enum:
                  - agent-may-be-streaming
                  - heartbeat-unavailable
                  - transcript-unavailable
        "400":
          description: |
            Typed `invalid_request`, `answer_to_missing`,
            `selections_no_question`, or `selections_invalid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            `session_unknown` — `session_name` is not in
            `config.sessions` and (for `task-{project}-{N}`) has no
            active worker-session record. Distinguished from
            `503 service_unavailable`, which is returned when the
            worker-service lookup itself fails for a worker-pattern
            name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Typed safety-gate or pane failures:

            - `unsafe_mid_tool` — agent's latest assistant response has
              an unmatched `tool_use_id`, or the transcript resolver
              couldn't fingerprint an exact archive while other
              archives exist for the project.
            - `unsafe_mid_stream` — heartbeat < 2 s old (strict).
            - `unsafe_unavailable_transcript` — strict mode and the
              events.jsonl tail read failed (permissions, IO error,
              decode failure). Loose mode continues with
              `X-PollyPM-Warning: transcript-unavailable`; force mode
              ignores.
            - `unsafe_unavailable_heartbeat` — strict mode and the
              pg heartbeat lookup raised (import / `latest_heartbeat`
              failure / malformed timestamp). Loose mode continues
              with `X-PollyPM-Warning: heartbeat-unavailable`; force
              mode ignores. A missing heartbeat row (no record yet)
              is NOT unavailable — that's the genuine "not streaming"
              signal and the send proceeds.
            - `pane_dead` — target pane is `pane_dead=1` in tmux.
            - `pane_invalid` — requested `pane` index is < 0, not
              present on the window, or the `list-panes` probe failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            Typed backing-store / process failures:

            - `window_missing` — the session is registered but its
              tmux window is not running (including the race where the
              window disappears between validation and `send-keys`).
            - `tmux_unavailable` — tmux binary missing or the tmux
              server timed out / is unreachable.
            - `send_failed` — generic `send-keys` failure (subprocess
              error, paste-buffer load failure).
            - `service_unavailable` — worker-session lookup failed for
              a `task-{project}-{N}` send (work-service open or
              `list_worker_sessions` raised). Distinct from
              `404 session_unknown`, which means the worker definitely
              isn't registered. Retry once the work-service backing
              store is reachable (Codex #2043 review v5 blocker 3 +
              v6 blocker 1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects/{key}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectKey"
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List tasks for a project
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/TaskStatus"
          description: Filter by `work_status`.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque cursor from a previous response's `next_cursor`.
      responses:
        "200":
          description: Page of tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{project}/{n}:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Task detail
      description: |
        Full task record — status, current node, executions,
        transitions, plan content (when this task is a plan task).
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tasks/{project}/{n}/approve:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: approveTask
      summary: Approve plan or code review
      description: |
        Approves the current review-node execution. The `kind` field
        on the request body discriminates plan-review vs
        code-review approvals; absent it, the API approves whichever
        review is active.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Approval recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /tasks/{project}/{n}/reject:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: rejectTask
      summary: Reject plan or code review with a reason
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
            examples:
              plan:
                value:
                  kind: plan
                  reason: "Scope is too broad — split into 3 tasks first."
      responses:
        "200":
          description: Rejection recorded; task transitions to `rework`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /tasks/{project}/{n}/queue:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: queueTask
      summary: Queue a draft task for execution
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Task transitioned `draft` → `queued`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /inbox:
    get:
      tags: [Inbox]
      operationId: listInbox
      summary: List inbox items
      parameters:
        - in: query
          name: project
          schema: { type: string }
        - in: query
          name: type
          schema:
            $ref: "#/components/schemas/InboxItemType"
        - in: query
          name: state
          schema:
            $ref: "#/components/schemas/InboxItemState"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Page of inbox items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /inbox/{id}:
    parameters:
      - $ref: "#/components/parameters/InboxId"
    get:
      tags: [Inbox]
      operationId: getInboxItem
      summary: Inbox item detail with full thread messages
      responses:
        "200":
          description: Inbox item detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxItemDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /inbox/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/InboxId"
    post:
      tags: [Inbox]
      operationId: replyInbox
      summary: Reply to a thread
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboxReplyRequest"
      responses:
        "201":
          description: Reply appended to the thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /inbox/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/InboxId"
    post:
      tags: [Inbox]
      operationId: archiveInbox
      summary: Archive (close) an inbox item
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Item moved to `closed/`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Server-Sent Events stream of audit-log events
      description: |
        Returns a `text/event-stream`. Each SSE message has:
        - `event: audit`
        - `id: <ts>` (the audit event timestamp; clients use this as
          `Last-Event-ID` on reconnect)
        - `data: <json>` matching the `Event` schema below.

        Server emits `: keep-alive` comment lines every 15 seconds.

        ### Filtering
        - `project=<key>` — only events for this project
        - `event=<glob>` — wildcard match on event name (e.g.
          `task.*`, `watchdog.*`).

        ### Reconnect
        - Browsers automatically send `Last-Event-ID` after a drop;
          the server replays from that point and tails.
        - For an explicit cold start, pass `?since=<ISO-8601>`.
        - With neither, the server only tails (no replay).
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: ISO-8601 timestamp; replay events with `ts > since`.
        - in: query
          name: project
          schema: { type: string }
        - in: query
          name: event
          schema: { type: string }
          description: Wildcard pattern matched against `event` field.
        - in: header
          name: Last-Event-ID
          schema: { type: string }
          description: Reconnect cursor; takes precedence over `since`.
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of newline-delimited SSE messages. The `data:`
                  field of each message is an `Event` JSON object.
              examples:
                stream:
                  summary: Two audit events
                  value: |
                    event: audit
                    id: 2026-05-07T12:01:33.022Z
                    data: {"schema":1,"ts":"2026-05-07T12:01:33.022Z","project":"pollypm","event":"task.status_changed","subject":"pollypm/142","actor":"pm","status":"done","metadata":{}}

                    event: audit
                    id: 2026-05-07T12:01:34.110Z
                    data: {"schema":1,"ts":"2026-05-07T12:01:34.110Z","project":"pollypm","event":"plan.version_incremented","subject":"pollypm/144","actor":"architect","status":"ok","metadata":{"version":2}}

        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Token from `~/.pollypm/api-token`. Generated on first
        `pm serve` startup; rotated via `pm api regen-token`.

  parameters:
    ProjectKey:
      in: path
      name: key
      required: true
      schema: { type: string }
      description: Project key (slug).
    ProjectKey2:
      in: path
      name: project
      required: true
      schema: { type: string }
      description: Project key (slug).
    TaskNumber:
      in: path
      name: n
      required: true
      schema: { type: integer, minimum: 1 }
      description: Task number within the project (per-project sequence).
    InboxId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Inbox item identifier.
    ChatSessionName:
      in: path
      name: session_name
      required: true
      schema: { type: string }
      description: |
        Chat surface identifier from `GET /chat/sessions` — e.g.
        `operator`, `architect_<project>`, `advisor_<project>`,
        `task-<project>-<n>`.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
      description: |
        Optional client-supplied key. Server caches the response for
        24h and replays it on retry with the same key.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                error:
                  code: unauthorized
                  message: Bearer token required
    InvalidRequest:
      description: Malformed body or query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Body shape valid but values failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Concurrent write conflict; state changed between read and write.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ---- Common -----------------------------------------------------
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case error code.
        message: { type: string }
        hint: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"

    ActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }

    # ---- Health -----------------------------------------------------
    HealthResponse:
      type: object
      required: [status, version, schema_version, started_at]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: PollyPM package version.
        schema_version:
          type: integer
          description: Audit-log / DB schema version.
        started_at:
          type: string
          format: date-time

    DoctorCheck:
      type: object
      required: [name, status, message]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [ok, warn, fail]
        message: { type: string }
        hint: { type: string }
    DoctorResponse:
      type: object
      required: [overall, checks]
      properties:
        overall:
          type: string
          enum: [ok, warn, fail]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheck"

    # ---- Projects ---------------------------------------------------
    ProjectKind:
      type: string
      enum: [git, polyglot, monorepo, unknown]
      description: Detected project kind. Extends with new values; clients should treat unknown values as `unknown`.

    ProjectGlyph:
      type: string
      enum: [green, amber, red, paused, unknown]
      description: Stop-light signal derived from the briefing.

    TaskCounts:
      type: object
      additionalProperties:
        type: integer
      description: Map of TaskStatus value -> count.
      example:
        draft: 3
        queued: 1
        in_progress: 2
        review: 1
        done: 42

    Project:
      type: object
      required: [key, name, path, tracked, kind, glyph, task_counts, open_inbox_count, pending_plan_review]
      properties:
        key: { type: string }
        name: { type: string }
        path: { type: string, description: Filesystem path (server-local). }
        tracked: { type: boolean }
        kind:
          $ref: "#/components/schemas/ProjectKind"
        persona_name: { type: string }
        state:
          type: string
          description: Briefing-derived high-level state label.
        glyph:
          $ref: "#/components/schemas/ProjectGlyph"
        task_counts:
          $ref: "#/components/schemas/TaskCounts"
        open_inbox_count: { type: integer }
        pending_plan_review: { type: boolean }

    ProjectActivityEntry:
      type: object
      required: [ts, event, subject, actor]
      properties:
        ts: { type: string, format: date-time }
        event: { type: string }
        subject: { type: string }
        actor: { type: string }
        status: { type: string }
        summary: { type: string }

    # ---- Dashboard (Phase 2 §3) -------------------------------------
    SessionActivity:
      type: object
      required: [name, role, project, project_label, status, description, age_seconds]
      properties:
        name: { type: string }
        role: { type: string }
        project: { type: string }
        project_label: { type: string }
        status: { type: string }
        description: { type: string }
        age_seconds: { type: number, format: float }

    CommitInfo:
      type: object
      required: [hash, message, author, age_seconds, project]
      properties:
        hash: { type: string }
        message: { type: string }
        author: { type: string }
        age_seconds: { type: number, format: float }
        project: { type: string }

    CompletedItem:
      type: object
      required: [title, kind, project, age_seconds]
      properties:
        title: { type: string }
        kind:
          type: string
          description: |
            One of `issue`, `commit`, or `pr`. Open-ended — clients
            should treat unknown values like `issue`.
        project: { type: string }
        age_seconds: { type: number, format: float }

    InboxPreview:
      type: object
      required: [sender, title, project, task_id, age_seconds]
      properties:
        sender: { type: string }
        title: { type: string }
        project: { type: string }
        task_id: { type: string }
        age_seconds: { type: number, format: float }

    AccountQuotaUsage:
      type: object
      required: [account_name, provider, email, used_pct, summary, severity]
      properties:
        account_name: { type: string }
        provider: { type: string }
        email: { type: string }
        used_pct: { type: integer }
        summary: { type: string }
        severity: { type: string }
        limit_label:
          type: string
          default: limit
        reset_at:
          type: string
          description: |
            ISO-8601 timestamp string, or empty string when the
            provider does not expose a reset window.

    DashboardRollups:
      type: object
      description: |
        Aggregate counters mirrored from the cockpit rail. Under
        `?project=<key>` only the project-derived counters
        (`tracked_count`, `open_inbox_count`, `pending_plan_reviews`)
        are narrowed; `alert_count` and the three `*_24h` activity
        counters remain whole-system. The response envelope's
        `scoped_fields` list enumerates which fields the filter
        actually narrowed.
      required:
        - tracked_count
        - open_inbox_count
        - pending_plan_reviews
        - alert_count
        - sweep_count_24h
        - message_count_24h
        - recovery_count_24h
      properties:
        tracked_count: { type: integer }
        open_inbox_count: { type: integer }
        pending_plan_reviews: { type: integer }
        alert_count: { type: integer }
        sweep_count_24h: { type: integer }
        message_count_24h: { type: integer }
        recovery_count_24h: { type: integer }

    DashboardTokens:
      type: object
      required: [today, total]
      properties:
        today: { type: integer }
        total: { type: integer }

    DashboardResponse:
      type: object
      required:
        - generated_at
        - daemon_status
        - projects
        - rollups
        - active_sessions
        - recent_commits
        - completed_items
        - recent_messages
        - tokens
        - account_usages
      properties:
        generated_at: { type: string, format: date-time }
        daemon_status:
          type: string
          description: |
            `up` (active sessions present anywhere in the system) or
            `down` (no active sessions / supervisor unreachable).
            Always derived from the unfiltered gather result —
            `?project=` does NOT influence this field, so callers
            polling per-project still see the true daemon health. Per
            spec §3.3, a down daemon is a normal operating mode, not a
            503.
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        rollups:
          $ref: "#/components/schemas/DashboardRollups"
        scoped_fields:
          type: array
          description: |
            Names of response fields actually narrowed by `?project=`.
            Empty when no filter is in effect. Lets clients tell which
            counters reflect the requested project vs which remain
            whole-system (see `DashboardRollups` for why the four
            activity counters stay global).
          items:
            type: string
        active_sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionActivity"
        recent_commits:
          type: array
          items:
            $ref: "#/components/schemas/CommitInfo"
        completed_items:
          type: array
          items:
            $ref: "#/components/schemas/CompletedItem"
        recent_messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxPreview"
        tokens:
          $ref: "#/components/schemas/DashboardTokens"
        account_usages:
          type: array
          items:
            $ref: "#/components/schemas/AccountQuotaUsage"
        daily_tokens:
          type: array
          description: |
            Optional `[date, tokens]` pairs (last 30 days). Only
            populated when `?include_token_history=true`.
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - type: string
              - type: integer
        briefing:
          type: string
          description: |
            Optional morning-briefing narrative. Only populated when
            `?include_briefing=true`.

    ProjectDrilldown:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [recent_activity, top_tasks]
          properties:
            recent_activity:
              type: array
              items:
                $ref: "#/components/schemas/ProjectActivityEntry"
            top_tasks:
              type: array
              items:
                $ref: "#/components/schemas/TaskSummary"
            plan_review:
              $ref: "#/components/schemas/Plan"

    RegisterProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute filesystem path to the project repository.
        name:
          type: string
          description: Display name. Defaults to repo directory name.
        slug:
          type: string
          description: |
            Optional canonical slug. Must match
            `slugify_project_key()` rules; rejected with
            `validation_error` otherwise.
        tracked:
          type: boolean
          default: true

    PlanRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [initial, replan]
          default: initial
        reason:
          type: string
          description: Required when `kind=replan`.
    PlanKickoffAccepted:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string, description: "Plan task id (project/N)." }
        status:
          type: string
          enum: [accepted]

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        thread_id:
          type: string
          description: Continue an existing thread when present.
    ChatAccepted:
      type: object
      required: [thread_id, status]
      properties:
        thread_id: { type: string }
        status:
          type: string
          enum: [accepted]

    # ---- Chat GET endpoints (P2 — discovery + history) --------------
    ChatSurfaceType:
      type: string
      enum: [operator, architect, advisor, worker]
      description: Persona category for a chat surface.

    ChatSurfaceWindow:
      type: object
      required: [tmux_session, window_name, present, pane_dead]
      properties:
        tmux_session: { type: string }
        window_name: { type: string }
        present:
          type: boolean
          description: True when the tmux window is currently running.
        pane_id: { type: string }
        pane_dead:
          type: boolean
          description: True when the pane is registered but its process exited.

    ChatSurfaceTranscript:
      type: object
      properties:
        source:
          type: string
          nullable: true
          enum: [jsonl, null]
          description: |
            `jsonl` when an `events.jsonl` archive exists for this
            surface; `null` for brand-new surfaces that haven't been
            written to yet (spec §4.8). The discovery endpoint never
            probes tmux — capture availability is decided by the
            history endpoint.
        path:
          type: string
          nullable: true
          description: Filesystem path to the archive when `source=jsonl`.

    ChatSurface:
      type: object
      required: [session_name, surface_type, window, transcript,
                 provider, auth_token_present]
      properties:
        session_name: { type: string }
        surface_type:
          $ref: "#/components/schemas/ChatSurfaceType"
        persona:
          type: string
          nullable: true
        project:
          type: string
          nullable: true
        task_id:
          type: integer
          nullable: true
          description: Per-task worker surfaces only.
        window:
          $ref: "#/components/schemas/ChatSurfaceWindow"
        transcript:
          $ref: "#/components/schemas/ChatSurfaceTranscript"
        cwd:
          type: string
          nullable: true
        provider: { type: string }
        auth_token_present: { type: boolean }
        worktree_path:
          type: string
          nullable: true

    ChatSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSurface"

    ChatMessageRole:
      type: string
      enum: [user, assistant, system, tool]

    ChatMessageType:
      type: string
      description: |
        Envelope discriminator per spec §3. Mirrors the runtime
        `MessageType` enum at `src/pollypm/web_api/chat/envelope.py:30-48`
        — `tests/web_api/test_openapi_conformance.py::test_chat_message_type_enum_matches_runtime`
        asserts set equality so future drift trips CI.

        `thinking` is reserved — the transcript ingestor does not
        currently preserve thinking blocks, so the API never emits
        them. The `include_thinking` query param + `thinking` enum
        value will return once the ingestor learns to round-trip them
        (follow-up #2048).
      enum:
        - text
        - tool_use
        - tool_result
        - ask_user
        - file
        - subagent_spawn
        - subagent_result
        - system_event

    ChatMessageEnvelope:
      type: object
      required: [id, ts, role, actor, type, text, metadata]
      properties:
        id:
          type: string
          description: Stable per-archive envelope id (used as cursor).
        ts:
          type: string
          description: ISO-8601 timestamp.
        role:
          $ref: "#/components/schemas/ChatMessageRole"
        actor:
          type: string
          description: Persona / actor name (falls back to `agent` / `worker`).
        type:
          $ref: "#/components/schemas/ChatMessageType"
        text: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: |
            Type-dependent payload. `subagent_result` envelopes carry
            `output_file` and `summary`. `subagent_transcript` inlining
            is deferred — see #2052.

    ChatMessagesResponse:
      type: object
      required: [session_name, surface_type, messages, has_more]
      properties:
        session_name: { type: string }
        surface_type:
          $ref: "#/components/schemas/ChatSurfaceType"
        persona:
          type: string
          nullable: true
        transcript_source:
          type: string
          nullable: true
          enum: [jsonl, capture, null]
          description: |
            Which source the envelopes came from for this request —
            `jsonl` (archive), `capture` (live tmux), or `null` (no
            archive yet and capture unavailable).
        transcript_path:
          type: string
          nullable: true
          description: Archive path when `transcript_source=jsonl`.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageEnvelope"
        has_more:
          type: boolean
          description: True when more pages exist after `next_cursor`.
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass back as `since_id` to fetch the next page. Applied
            in the same order as the previous response so `asc` and
            `desc` pagination both walk without duplicates.

    # ---- Chat POST endpoint (P3 — send) -----------------------------
    ChatSendSafety:
      type: string
      enum: [strict, loose, force]
      description: |
        Safety gate level.

        * `strict` (default): All safety gates active. Fails closed
          (409) when signals are unavailable as well as when they
          report unsafe:
          - `unsafe_mid_tool` — open tool_use in the latest assistant
            turn.
          - `unsafe_mid_stream` — heartbeat <2s old.
          - `unsafe_unavailable_transcript` — transcript file exists
            but can't be read (permissions, IO error). Mid-tool gate
            can't be evaluated; strict fails closed.
          - `unsafe_unavailable_heartbeat` — pg pool / heartbeat
            backing-store outage. Mid-stream gate can't be evaluated;
            strict fails closed.
        * `loose`: Mid-tool gate active. Mid-stream check is
          best-effort. Continues on unavailable signals and surfaces
          one of the following `X-PollyPM-Warning` response headers:
          `agent-may-be-streaming`, `heartbeat-unavailable`, or
          `transcript-unavailable`.
        * `force`: All safety gates bypassed. Pane and window
          validation (`pane_invalid`, `pane_dead`, `window_missing`,
          `tmux_unavailable`) is NOT bypassed.

    ChatSendRequest:
      type: object
      properties:
        text:
          type: string
          description: |
            Free-text body to send. Required when `selections` is
            empty and no `answer_to` is set.
        press_enter:
          type: boolean
          default: true
          description: Submit the buffer by pressing Enter after the text lands.
        answer_to:
          type: string
          description: |
            ID of an `ask_user` envelope in the session's transcript
            that this send answers. When set, `selections` must
            reference one of the question's option labels (§4.5).
        selections:
          type: array
          items: { type: string }
          description: |
            Selected option labels for an AskUserQuestion reply.
            Each entry must exactly match one of the question's
            option labels.
        notes:
          type: string
          description: |
            Optional free-text addition appended after `selections`
            when answering an `ask_user`. Ignored for plain text
            sends.
        safety:
          $ref: "#/components/schemas/ChatSendSafety"
        pane:
          type: integer
          minimum: 0
          description: |
            0-based pane index inside the target window. Defaults
            to the active pane. Validated against `tmux list-panes`
            — out-of-range indexes return `409 pane_invalid`; dead
            panes return `409 pane_dead`.

    ChatSendResponse:
      type: object
      required: [ok, message_id, session_name, window_target, characters_sent, method]
      properties:
        ok: { type: boolean }
        message_id:
          type: string
          description: Synthetic id for the send request (echoed for tracing).
        session_name: { type: string }
        window_target:
          type: string
          description: |
            `tmux` target the send was routed to
            (`<storage-closet>:<window>[.<pane>]`).
        characters_sent: { type: integer, minimum: 0 }
        method:
          type: string
          enum: [send_keys, paste_buffer]
          description: |
            `paste_buffer` is used automatically for bodies > 100
            characters; `send_keys` otherwise.
        press_enter_at:
          type: string
          nullable: true
          description: |
            ISO-8601 UTC timestamp of the Enter press, or null when
            `press_enter=false`.

    # ---- Tasks ------------------------------------------------------
    TaskStatus:
      type: string
      enum:
        - draft
        - queued
        - in_progress
        - rework
        - blocked
        - on_hold
        - review
        - done
        - cancelled

    TaskType:
      type: string
      enum: [epic, task, subtask, bug, spike]

    TaskPriority:
      type: string
      enum: [critical, high, normal, low]

    TaskSummary:
      type: object
      required: [task_id, project, task_number, title, work_status, type, priority]
      properties:
        task_id: { type: string }
        project: { type: string }
        task_number: { type: integer }
        title: { type: string }
        work_status:
          $ref: "#/components/schemas/TaskStatus"
        type:
          $ref: "#/components/schemas/TaskType"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assignee: { type: string }
        current_node_id: { type: string }
        plan_version: { type: integer }
        updated_at: { type: string, format: date-time }

    Transition:
      type: object
      required: [from_state, to_state, actor, timestamp]
      properties:
        from_state: { type: string }
        to_state: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        reason: { type: string }

    Artifact:
      type: object
      required: [kind, description]
      properties:
        kind:
          type: string
          enum: [commit, file_change, action, note]
        description: { type: string }
        ref: { type: string }
        path: { type: string }
        external_ref: { type: string }

    WorkOutput:
      type: object
      required: [type, summary]
      properties:
        type:
          type: string
          enum: [code_change, action, document, mixed]
        summary: { type: string }
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"

    FlowNodeExecution:
      type: object
      required: [task_id, node_id, visit, status]
      properties:
        task_id: { type: string }
        node_id: { type: string }
        visit: { type: integer }
        status:
          type: string
          enum: [pending, active, blocked, completed, abandoned]
        decision:
          type: string
          enum: [approved, rejected]
        decision_reason: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        work_output:
          $ref: "#/components/schemas/WorkOutput"

    ContextEntry:
      type: object
      required: [actor, timestamp, text, entry_type]
      properties:
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        text: { type: string }
        entry_type:
          type: string
          enum: [note, reply, read]

    TaskRelationships:
      type: object
      properties:
        parent: { type: string, description: "Parent task id (project/N) or null." }
        children:
          type: array
          items: { type: string }
        blocks:
          type: array
          items: { type: string }
        blocked_by:
          type: array
          items: { type: string }
        relates_to:
          type: array
          items: { type: string }
        supersedes: { type: string }
        superseded_by: { type: string }

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [description, transitions, executions, relationships]
          properties:
            description: { type: string }
            acceptance_criteria: { type: string }
            constraints: { type: string }
            labels:
              type: array
              items: { type: string }
            relevant_files:
              type: array
              items: { type: string }
            relationships:
              $ref: "#/components/schemas/TaskRelationships"
            flow_template_id: { type: string }
            flow_template_version: { type: integer }
            requires_human_review: { type: boolean }
            predecessor_task_id: { type: string }
            transitions:
              type: array
              items:
                $ref: "#/components/schemas/Transition"
            executions:
              type: array
              items:
                $ref: "#/components/schemas/FlowNodeExecution"
            context:
              type: array
              items:
                $ref: "#/components/schemas/ContextEntry"
            external_refs:
              type: object
              additionalProperties: { type: string }
            total_input_tokens: { type: integer }
            total_output_tokens: { type: integer }
            session_count: { type: integer }
            created_at: { type: string, format: date-time }
            created_by: { type: string }
            plan:
              $ref: "#/components/schemas/Plan"
              description: Populated only when this task is a plan task at review.

    TaskListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        next_cursor:
          type: string
          description: Absent when no more pages.

    ApproveRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [plan, code_review, auto]
          default: auto
          description: |
            `auto` (default) approves whichever review is active.
            `plan` and `code_review` are explicit and reject with
            `invalid_state` if that review type is not active.
        note:
          type: string
          description: Optional approval note recorded on the execution.

    RejectRequest:
      type: object
      required: [reason]
      properties:
        kind:
          type: string
          enum: [plan, code_review, auto]
          default: auto
        reason:
          type: string
          minLength: 1

    # ---- Plan -------------------------------------------------------
    PlanJudgmentCall:
      type: object
      required: [point]
      properties:
        point:
          type: string
          description: One judgment-call bullet from the architect.

    Plan:
      type: object
      required: [task_id, version, summary, judgment_calls, body, created_at]
      properties:
        task_id: { type: string }
        version: { type: integer, minimum: 1 }
        predecessor_task_id: { type: string }
        summary: { type: string }
        judgment_calls:
          type: array
          items:
            $ref: "#/components/schemas/PlanJudgmentCall"
        body:
          type: string
          description: Full plan markdown.
        critic_synthesis:
          type: string
          description: Architect critic notes; nullable.
        created_at: { type: string, format: date-time }

    # ---- Inbox ------------------------------------------------------
    InboxItemType:
      type: string
      description: |
        Open enumeration. Known values include `message`,
        `plan_review`, `blocking_question`, `alert`. Clients should
        treat unknown values as `message`.
      enum:
        - message
        - plan_review
        - blocking_question
        - alert

    InboxItemState:
      type: string
      enum:
        - open
        - threaded
        - waiting-on-pa
        - waiting-on-pm
        - resolved
        - closed

    InboxOwner:
      type: string
      enum: [pm, pa, worker, operator]

    InboxItem:
      type: object
      required: [id, project, type, state, subject, owner, created_at, updated_at]
      properties:
        id: { type: string }
        project: { type: string }
        type:
          $ref: "#/components/schemas/InboxItemType"
        state:
          $ref: "#/components/schemas/InboxItemState"
        subject: { type: string }
        preview: { type: string, description: Short preview of the body. }
        owner:
          $ref: "#/components/schemas/InboxOwner"
        thread_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          description: |
            Sidecar fields. For `plan_review` items this includes
            `task_id`, `judgment_calls` (string array), and a plan
            preview.

    InboxMessage:
      type: object
      required: [id, sender, timestamp, body]
      properties:
        id: { type: string }
        sender:
          type: string
          description: "`operator`, `pm`, `pa`, or worker session name."
        timestamp: { type: string, format: date-time }
        body: { type: string }

    InboxItemDetail:
      allOf:
        - $ref: "#/components/schemas/InboxItem"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/InboxMessage"

    InboxListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"
        next_cursor: { type: string }

    InboxReplyRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1

    # ---- Events -----------------------------------------------------
    Event:
      type: object
      required: [schema, ts, project, event, subject, actor, status]
      properties:
        schema:
          type: integer
          description: Audit-log schema version (currently 1).
        ts:
          type: string
          format: date-time
        project: { type: string }
        event:
          type: string
          description: |
            Stable `noun.verb` event name. Examples: `task.created`,
            `task.status_changed`, `plan.version_incremented`,
            `plan.successor_created`, `worker.session_reaped`,
            `watchdog.escalation_dispatched`, `socket.reaped`,
            `work_db.opened`.
        subject:
          type: string
          description: Resource id the event is about (e.g. `pollypm/142`).
        actor: { type: string }
        status: { type: string }
        metadata:
          type: object
          additionalProperties: true
      example:
        schema: 1
        ts: "2026-05-07T12:01:33.022Z"
        project: pollypm
        event: task.status_changed
        subject: pollypm/142
        actor: pm
        status: done
        metadata: {}
