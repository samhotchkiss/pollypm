  /tasks/{project}/{n}/reassign:
    parameters:
      - $ref: "#/components/parameters/ProjectKey2"
      - $ref: "#/components/parameters/TaskNumber"
    post:
      tags: [Tasks]
      operationId: reassignTask
      summary: Change the task's assignee
      description: |
        Reassigns the task to a new worker. Updates the `assignee`
        column AND appends a work-context breadcrumb (entry_type
        `reassignment`) recording the old→new transition. Both
        mutations land in a single transaction; concurrent reassigns
        serialize via `SELECT ... FOR UPDATE` so the breadcrumb chain
        names the actual previous owner.

        The task's `work_status` is unchanged (no state-machine
        transition fires). Spec §5.3 leaves `null ⇒ unassign` open;
        this endpoint requires a non-empty `actor`. The breadcrumb is
        attributed to `"api"` (the HTTP layer is the operator).

        This is the ONLY operator surface for changing `assignee`
        (#2064 round-9 blocker #5). PATCH `/tasks/{p}/{n}` does not accept the assignee field
        — the `TaskPatchRequest` schema is
        `additionalProperties: false`, so unknown keys including
        `assignee` are rejected with `422 validation_error` at
        request validation. `pm task update` does not advertise
        `--assignee` either. There is no breadcrumb-less assignee
        update path on either surface — every assignee change
        records a `reassignment` context entry so the new owner
        can recover via `pm task get`.

        Refuses non-live tasks (`draft`, `queued`, `done`,
        `cancelled`) with `409 invalid_state` — reassign is a
        mid-flight worker swap (spec §P-9), not a generic
        owner-relabel. Queued tasks cannot be reassigned (#2064
        round-11 blocker #3): queued dispatch routes by
        `task.roles["worker"]`, not the `assignee` column, so a
        queued reassign would set `assignee` to the new owner but
        the next `claim()` would still route to the original role
        owner. To redirect a queued task: cancel + re-queue with
        the new `roles.worker`.

        `Idempotency-Key` and `If-Match` are intentionally NOT
        accepted — no replay cache or version-token enforcement
        exists yet (#2064 round-1, mirrors #2060).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReassignRequest"
      responses:
        "200":
          description: |
            200 OK with hydrated TaskDetail including the new context
            entry (entry_type='reassignment') with body like
            `worker reassigned from <old> to <new>`. The assignee
            column is updated and the breadcrumb is appended in a
            single atomic transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

