[project]
name = "pollypm"
version = "1.0.0rc2"
description = "Tmux-first orchestration for interactive CLI coding agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  "packaging>=23.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "textual>=6.1.0",
  "typer>=0.16.0",
  "uvicorn>=0.30.0",
  # Postgres is the only supported storage backend (#1737). Keeping
  # these as base ``dependencies`` (rather than an opt-in extra)
  # closes the "reinstall trap" (#1813, #1746) where
  # ``uv tool install --reinstall pollypm`` silently dropped the pg
  # driver and the cockpit crashed at first connection. pgvector
  # ships the psycopg type adapter for the recall path (Slice D).
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "openapi-spec-validator>=0.7.0",
  "pytest>=8.4.0",
  "ruff>=0.15.12",
  "testcontainers[postgres]>=4.8.0",
]

[project.scripts]
pm = "pollypm.cli:app"
pollypm = "pollypm.cli:app"

[project.entry-points."pollypm.store_backend"]
sqlite = "pollypm.store.sqlalchemy_store:SQLAlchemyStore"
postgres = "pollypm.store.backends.pg_store:PgStore"

# Phase B (#397) — both providers extracted into their own packages.
# Phase A shipped the substrate (Protocol + registry + legacy shims);
# Phase C extracted Codex; Phase B extracts Claude. Third-party providers
# register by adding their own entry in this group via their own package.
[project.entry-points."pollypm.provider"]
claude = "pollypm.providers.claude:ClaudeProvider"
codex = "pollypm.providers.codex:CodexProvider"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pollypm = [
  "model_registry.toml",
  "plugins_builtin/*/pollypm-plugin.toml",
  "plugins_builtin/*/profiles/*.md",
  "plugins_builtin/*/flows/*.yaml",
  "plugins_builtin/*/skills/*.md",
  "defaults/rules/*.md",
  "defaults/magic/*.md",
  "defaults/magic/*/*.md",
  "defaults/magic/*/**/*.md",
  "defaults/magic/*/**/*.html",
  "defaults/magic/*/**/*.sh",
  "defaults/magic/*/**/*.json",
  "defaults/magic/*/LICENSE",
  "defaults/docs/*.template",
  "defaults/docs/*.md",
  "defaults/docs/reference/*.md",
  "defaults/demo/*",
  "defaults/demo/**/*",
  "work/flows/*.yaml",
  "agents/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "benchmark: performance benchmark tests (recall latency, etc.)",
  # #1737 Slice F: the ``work_service`` dispatch fixture in
  # ``tests/conftest.py`` reads this marker to decide whether a test runs
  # against ``SQLiteWorkService`` (default), ``PgWorkService``, or both.
  # Usage: ``@pytest.mark.backend('postgres')`` / ``('sqlite')`` /
  # ``('both')``. Unmarked tests stay on sqlite until Slice K cuts over.
  "backend(name): pin a test to a work-service backend ('sqlite', 'postgres', or 'both')",
]
