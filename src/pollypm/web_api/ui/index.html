<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PollyPM</title>
<link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="brand-mark">◆</span>
    <span class="brand-name">PollyPM</span>
    <span class="brand-tag">v0 web</span>
  </div>
  <div id="conn-status" class="conn-status conn-unknown" title="Connection status">
    <span class="conn-dot"></span>
    <span class="conn-label">connecting…</span>
  </div>
</header>

<main id="layout">
  <aside id="surface-rail" aria-label="Chat surfaces">
    <h2 class="rail-title">Projects</h2>
    <div class="project-controls">
      <input
        id="project-filter"
        class="rail-input"
        type="search"
        placeholder="Search projects"
        aria-label="Search projects"
        autocomplete="off"
      />
      <select
        id="project-sort"
        class="rail-select"
        aria-label="Sort projects"
      >
        <option value="urgency">Urgency</option>
        <option value="recent">Recent</option>
        <option value="name">Name</option>
        <option value="inbox_desc">Inbox</option>
      </select>
    </div>
    <ul id="project-list" class="project-list">
      <li class="project-empty">loading…</li>
    </ul>
    <h2 class="rail-title">Surfaces</h2>
    <div class="surface-filter-wrap">
      <input
        id="surface-filter"
        class="rail-input surface-filter"
        type="search"
        placeholder="Search surfaces"
        aria-label="Filter surfaces"
        autocomplete="off"
      />
      <select
        id="task-status-filter"
        class="rail-select task-status-filter"
        aria-label="Filter tasks by status"
      >
        <option value="">Recent tasks</option>
        <option value="attention">Needs attention</option>
        <option value="active">Active work</option>
        <option value="blocked">Blocked / held</option>
        <option value="review">Review</option>
        <option value="done">Done</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <ul id="surface-list" class="surface-list">
      <li class="surface-empty">loading…</li>
    </ul>
  </aside>

  <section id="message-pane" aria-label="Messages">
    <header class="pane-header">
      <h2 id="pane-title">Select a surface</h2>
      <span id="pane-meta" class="pane-meta"></span>
    </header>
    <div id="message-list" class="message-list" aria-live="polite">
      <div class="message-empty">No surface selected.</div>
    </div>
    <form id="send-form" class="send-form" autocomplete="off">
      <input
        id="send-input"
        class="send-input"
        type="text"
        name="text"
        placeholder="Message the selected surface…"
        disabled
        aria-label="Send message"
      />
      <button
        id="stop-agent-button"
        class="stop-agent-button"
        type="button"
        hidden
        disabled
      >Stop</button>
      <button id="send-button" class="send-button" type="submit" disabled>Send</button>
    </form>
  </section>

  <aside id="dashboard-rail" aria-label="Dashboard">
    <h2 class="rail-title">Dashboard</h2>
    <div id="dashboard-rollups" class="dashboard-rollups">
      <div class="rollup-empty">loading…</div>
    </div>
    <h2 class="rail-title">Activity</h2>
    <div class="activity-controls">
      <select id="activity-since" class="rail-select" aria-label="Activity window">
        <option value="24h">24h</option>
        <option value="2d" selected>2d</option>
        <option value="7d">7d</option>
      </select>
      <button
        id="activity-refresh"
        class="activity-refresh"
        type="button"
      >Refresh</button>
    </div>
    <div id="activity-summary" class="activity-summary">
      <div class="activity-empty">loading…</div>
    </div>
    <div id="activity-feed" class="activity-feed">
      <div class="activity-empty">loading…</div>
    </div>
  </aside>
</main>

<script src="/ui/app.js" defer></script>
</body>
</html>
