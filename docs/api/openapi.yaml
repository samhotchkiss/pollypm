      summary: One session's config + live health snapshot
      description: |
        Returns the `[sessions]` config row + last heartbeat + tmux
        health (window present, pane alive, pane command). `is_turn_active`
        reflects whether the agent is mid-turn at request time — clients
        should treat it as a safety hint, not a contract.
      responses:
        "200":
          description: Single-session detail payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/SessionName"
    post:
      tags: [Sessions]
      operationId: restartSession
      summary: Facade-driven relaunch (Supervisor.restart_session) for one session
      description: |
        Routes through `pollypm.supervisor.Supervisor.restart_session`
        — the same canonical facade `pm switch-session-account`, the
        cockpit account-switch button, and the upgrade flow already
        use. The facade tears down the existing window and re-launches
        via the launch planner so the relaunched pane runs the
        configured provider command (NOT an ad-hoc `echo`
        placeholder).

        The account the facade restarts under is the runtime's
        `effective_account` if set (so a session that previously
        failed over keeps using the recovered account), otherwise the
        session's configured `account`.

        Safety gate. `strict` (default) refuses with:
        * `409 unsafe_mid_turn` when the agent is mid-turn.
        * `503 unsafe_mid_turn_unknown` when the mid-turn probe
          itself fails (transient tmux/parse errors must NOT be
          treated as "agent is idle" — fail-closed).

        `?safety=force` bypasses BOTH the mid-turn check and the
        probe-unknown check.

        `?force=true` or `{"force": true}` bypasses a human-held
        session lease only. It does not bypass the mid-turn safety
        gate; combine with `?safety=force` only when the operator
        intentionally wants both overrides.

        Returns `409 session_leased` when the session is leased to
        another owner and `force` was not requested.

        Returns `503 daemon_unavailable` when the supervisor or tmux
        session service can't be constructed, when no account can be
        resolved for the session, or when `restart_session` raises.
      parameters:
        - in: query
          name: safety
          schema:
            type: string
            enum: [strict, loose, force]
            default: strict
          description: |
            Safety gate. `strict` (default) refuses while the agent is
            mid-turn; `force` bypasses the mid-turn gate. `loose` is
            treated like `strict` for this verb (no warn-and-proceed
            semantics defined yet).
        - in: query
          name: force
          schema:
            type: boolean
            default: false
          description: |
            Bypass a human-held session lease. This does not bypass the
            mid-turn safety probe; use `safety=force` for that.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: |
                    Bypass a human-held session lease. This does not
                    bypass the mid-turn safety probe; use
                    `safety=force` for that.
      responses:
        "200":
          description: Restart completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            One of:
            * `code=unsafe_mid_turn` — refused because the agent is
              mid-turn. Re-issue with `?safety=force` to override.
            * `code=session_leased` — refused because the session is
              leased to another owner. Re-issue with `?force=true` or
              `{"force": true}` to override the lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            One of:
            * `code=unsafe_mid_turn_unknown` — strict-mode safety
              probe failed and could not confirm the agent is idle
              (fail-closed). Retry once tmux is healthy or pass
              `?safety=force` to override.
            * `code=daemon_unavailable` — supervisor / tmux session
              service unavailable, no account resolvable, or
              `restart_session` raised. Confirm the daemon / cockpit
              is running, then retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{name}/interrupt:
    parameters:
      - $ref: "#/components/parameters/SessionName"
    post:
      tags: [Sessions]
      operationId: interruptSession
      summary: Send Escape to a live session or worker pane
      description: |
        Sends the non-destructive interrupt key (`Escape`) to the live
        tmux pane backing a configured session or active
        `task-<project>-<n>` worker surface. The endpoint resolves
        configured sessions through `config.sessions[].window_name`.
        Worker surfaces are accepted only when the window name matches
        the canonical task-worker pattern and the project is registered.

        This intentionally does not send `Ctrl-C`: embedded agents
        advertise `esc to interrupt`, and Escape is less likely to kill
        the shell process underneath the agent.
      responses:
        "200":
          description: Interrupt key sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Pane is dead or missing a pane id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: tmux unavailable or target window missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{name}/pause:
    parameters:
      - $ref: "#/components/parameters/SessionName"
    post:
      tags: [Sessions]
      operationId: pauseSession
      summary: Tag a session paused (partial enforcement — see description)
      description: |
        **Partial enforcement.** The pause marker is HONORED by the
        recovery loops
        (`pollypm.recovery.no_session_spawn.auto_recover_no_session_alerts`
        + `pollypm.supervisor.Supervisor.maybe_recover_session`, which
        covers loop 1 plus loops 2/3 via the shared apply path); those
        loops emit a `session.pause.skip` audit event and yield. The
        remaining dispatch / cockpit / heartbeat loops do NOT yet
        consume the marker — closing those gaps is tracked under #2068.
        The response `message` spells out which loops have been
        quiesced so operators are never misled.

        Idempotent. Writes the session name into the project's pause
        marker (`<base_dir>/paused-sessions.json`) using atomic
        tmp+rename, with `fcntl.flock` serialising concurrent
        pause/resume callers. `GET /api/v1/sessions` surfaces the
        marker on the separate `paused: true` field; the `status`
        field continues to reflect actual runtime health (so a
        paused-but-missing session reports `status="missing"` AND
        `paused=true`). The tmux window itself is left alone.
      responses:
        "200":
          description: Pause recorded (or already paused).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            One of three transient states:

            * `code=marker_unreadable` — the on-disk pause marker
              exists but cannot be parsed (corrupt JSON, wrong
              document shape, or permission denied). The recovery
              loops are failing closed (treating every session as
              paused) until an operator repairs or deletes the
              marker manually. The endpoint refuses to overwrite the
              file because doing so would silently drop any other
              paused sessions the marker may have held (PR #2081
              round 3 finding 2).
            * `code=daemon_unavailable` — the config carries no
              `project.base_dir`, so the marker has nowhere to
              live. Bring the daemon / cockpit up and retry.
            * `code=service_unavailable` — filesystem error while
              writing the marker. Check permissions on
              `~/.pollypm`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{name}/resume:
    parameters:
      - $ref: "#/components/parameters/SessionName"
    post:
      tags: [Sessions]
      operationId: resumeSession
      summary: Clear the pause marker for a session (inverse of pause)
      description: |
        Idempotent inverse of `pauseSession`. Same partial-enforcement
        caveat applies — clearing the marker lifts the yield in the
        recovery loops (`no_session_spawn`,
        `Supervisor.maybe_recover_session`) immediately, but the
        remaining dispatch / cockpit / heartbeat loops were never
        honouring the marker in the first place (tracked under #2068).

        Removes the session name from the project's pause marker.
        Returns 200 with no state change if the session wasn't
        tagged.
      responses:
        "200":
          description: Resume recorded (or already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: |
            One of three transient states:

            * `code=marker_unreadable` — the on-disk pause marker
              exists but cannot be parsed (corrupt JSON, wrong
              document shape, or permission denied). Recovery loops
              are failing closed until an operator repairs or
              deletes the marker; the endpoint deliberately refuses
              to claim a successful resume in this state because the
              recovery loops would remain quiesced (PR #2081 round
              3 finding 2).
            * `code=daemon_unavailable` — the config carries no
              `project.base_dir`.
            * `code=service_unavailable` — filesystem error while
              writing the marker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage:
    get:
      tags: [Storage]
      operationId: getStorageReport
      summary: ~/.pollypm/ disk-usage report
      description: |
        Returns the whole-home storage report — every canonical subdir
        of `~/.pollypm/` (snapshots, transcripts, homes, agent_homes,
        worktrees, audit, artifacts, checkpoints, dossier, logs) plus a
        rollup of top-level config files (`pollypm.toml`, `state.db`,
        etc.).

        Mirrors `pm storage report --json` (#2040). The scan is
        eventually-consistent: a file written mid-walk may surface as a
        partial size on this response.

        A non-existent `~/.pollypm/` is a normal mode (fresh install
        or alternate `base_dir`) — the endpoint returns `200` with an
        empty `subdirs` list and zero totals, not `503`.

        Per the Phase 2 spec §12.2 there is **no** prune endpoint;
        deletion stays CLI-only (`pm storage prune`).
      responses:
        "200":
          description: Storage report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Storage tree scan failed (mid-request unmount, etc).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /heartbeats:
    get:
      tags: [Heartbeats]
      operationId: listHeartbeats
      summary: Latest heartbeat per configured session
      description: |
        Returns one `HeartbeatLatest` row per enabled session in the
        operator's config. Sessions that have never reported in get
        `status="initializing"` and `last_tick_ts=null`. Disabled
        sessions are filtered out — their absence from the ledger is
        correct, not a bug.

        Status classification matches `pm sessions`:
        - `healthy`  — last tick ≤ 5 minutes old
        - `stale`    — last tick > 5 minutes old
        - `initializing` — no ledger row yet
        - `unknown`  — ledger row exists but the timestamp is
          unparseable

        Backing-store outages bubble as `503 service_unavailable` so
        callers can retry. We do **not** paper over a pg-pool outage
        with an empty list — that would tell the cockpit "every session
        is initializing" which is dangerously misleading.
      responses:
        "200":
          description: One row per configured session, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatsListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Heartbeats ledger unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/{subdir}:
    parameters:
      - in: path
        name: subdir
        required: true
        schema: { type: string }
        description: |
          One of the canonical `~/.pollypm/` subdir names: `snapshots`,
          `transcripts`, `homes`, `agent_homes`, `worktrees`, `audit`,
          `artifacts`, `checkpoints`, `dossier`, `logs`.
    get:
      tags: [Storage]
      operationId: getStorageSubdir
      summary: Single ~/.pollypm/ subdir slice
      description: |
        Returns one row of the storage report — same shape as the
        entries in `StorageReport.subdirs[]`. Restricted to the
        canonical subdir list; arbitrary user paths are not accepted
        (use `GET /api/v1/storage` for the whole-home view).
      responses:
        "200":
          description: Subdir scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Storage tree scan failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /heartbeats/{session_name}:
    parameters:
      - in: path
        name: session_name
        required: true
        schema: { type: string }
        description: |
          Session name to look up. May refer to a configured session
          (`operator`, `architect_<project>`, …) or any session the
          heartbeats ledger remembers — e.g. a task-worker that's been
          reaped but still has rows on disk.
    get:
      tags: [Heartbeats]
      operationId: getHeartbeat
      summary: Latest heartbeat + recent history for one session
      description: |
        Returns the latest tick plus up to `limit` recent ticks (newest
        first) for `session_name`. Configured-but-silent sessions
        return 200 with `status="initializing"` and an empty `ticks`
        list. Genuinely-unknown session names (not in config, not in
        ledger) return `404 not_found`.

        `limit` clamps silently at 200 (Phase 2 §11.3) — a caller
        asking for 1000 ticks gets the top 200 plus `clamped=true`
        rather than a 422.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 20 }
          description: |
            Max history ticks (newest-first). Default 20, clamped at
            200. Values > 200 succeed with `clamped: true` in the
            response body.
      responses:
        "200":
          description: Latest + recent ticks for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            Session is not in config and not in the heartbeats ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Heartbeats ledger unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Server-Sent Events stream of audit-log events
      description: |
        Returns a `text/event-stream`. Each SSE message has:
        - `event: audit`
        - `id: <ts>` (the audit event timestamp; clients use this as
          `Last-Event-ID` on reconnect)
        - `data: <json>` matching the `Event` schema below.

        Server emits `: keep-alive` comment lines every 15 seconds.

        ### Filtering
        - `project=<key>` — only events for this project
        - `event=<glob>` — wildcard match on event name (e.g.
          `task.*`, `watchdog.*`).

        ### Reconnect
        - Browsers automatically send `Last-Event-ID` after a drop;
          the server replays from that point and tails.
        - For an explicit cold start, pass `?since=<ISO-8601>`.
        - With neither, the server only tails (no replay).
      parameters:
        - in: query
          name: since
          schema:
            type: string
            format: date-time
          description: ISO-8601 timestamp; replay events with `ts > since`.
        - in: query
          name: project
          schema: { type: string }
        - in: query
          name: event
          schema: { type: string }
          description: Wildcard pattern matched against `event` field.
        - in: header
          name: Last-Event-ID
          schema: { type: string }
          description: Reconnect cursor; takes precedence over `since`.
      responses:
        "200":
          description: SSE stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of newline-delimited SSE messages. The `data:`
                  field of each message is an `Event` JSON object.
              examples:
                stream:
                  summary: Two audit events
                  value: |
                    event: audit
                    id: 2026-05-07T12:01:33.022Z
                    data: {"schema":1,"ts":"2026-05-07T12:01:33.022Z","project":"pollypm","event":"task.status_changed","subject":"pollypm/142","actor":"pm","status":"done","metadata":{}}

                    event: audit
                    id: 2026-05-07T12:01:34.110Z
                    data: {"schema":1,"ts":"2026-05-07T12:01:34.110Z","project":"pollypm","event":"plan.version_incremented","subject":"pollypm/144","actor":"architect","status":"ok","metadata":{"version":2}}

        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit/grep:
    get:
      tags: [Audit]
      operationId: grepAudit
      summary: Search audit-log events (rotation-aware)
      description: |
        Returns audit events that match the supplied filters. Mirrors
        the `pm audit grep` CLI command (PR #2036) and reuses its
        rotation-aware file walker so live `.jsonl` + gzipped
        `.gz` archives are searched together.

        Filters apply in cheap→expensive order (Codex round-10
        reorder, PR #2062): JSON decode, then exact `event_type`
        match, then `ts` parse, then `since` cutoff, then
        `pattern` substring/regex match on the raw line. The
        pattern runs LAST so the `safe_regex=true` per-line
        wall-clock budget is only spent on rows already inside the
        requested `since` window — this ordering is part of the
        safety/performance contract for regex mode (paired with the
        `safe_regex` + `since` requirement and `deadline_seconds`
        bound). The response is capped at `limit` matches (default
        100, max 1000 per spec §8.3).

        `pattern` is a LITERAL substring by default; pass
        `safe_regex=true` to interpret it as a Python `re.search`
        regex. Both modes cap the pattern at 200 characters to keep
        ReDoS exposure off the API worker (see PR #2062 round 2 —
        Codex P0 finding). If you need a more elaborate forensic
        query, use the CLI (`pm audit grep`) where the operator
        explicitly trusts the local pattern.

        `next_cursor` is reserved for a future cursor-paginated
        variant; today the endpoint always returns `null`.
        `_malformed_rows_skipped` is non-zero when at least one
        archived row failed `Event` validation (typically a non-ISO
        `ts` from an old schema) and was dropped rather than 500'ing
        the response.

        Round-4 (PR #2062) added request-level bounds for the regex
        path: `safe_regex=true` now REQUIRES `since` (returns
        `400 invalid_request` without it — `limit` only caps matches,
        not scanned lines, so the window must be bounded up front),
        and `deadline_seconds` (default 5.0) imposes a wall-clock
        budget. When the deadline fires the response sets
        `_truncated_by_deadline=true` and `_lines_scanned` reports
        how far the walker got.
      parameters:
        - in: query
          name: project
          schema: { type: string }
          description: Scope to one project (per-project log + central tail).
        - in: query
          name: since
          schema: { type: string }
          description: |
            ISO-8601 timestamp (e.g. `2026-05-21T03:14:15Z`) or a
            shortcut of the form `<N><unit>` where unit is one of
            `s` / `m` / `h` / `d` / `w` (seconds / minutes / hours /
            days / weeks). Result is `now - delta` in UTC.
        - in: query
          name: event_type
          schema: { type: string }
          description: Exact match on the `.event` field (not a regex).
        - in: query
          name: pattern
          schema:
            type: string
            maxLength: 200
          description: |
            Substring matched against the raw JSONL line. Literal by
            default; pass `safe_regex=true` to interpret as a Python
            `re.search` pattern. Capped at 200 characters; longer
            patterns return `400 invalid_request`.
        - in: query
          name: safe_regex
          schema:
            type: boolean
            default: false
          description: |
            Opt in to regex semantics for `pattern`. Default false
            (literal substring) keeps ReDoS hazards off the API
            worker — operators who need a true regex pass this
            explicitly.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Cap matches returned. Max 1000 per spec §8.3.
        - in: query
          name: deadline_seconds
          schema:
            type: number
            format: float
            minimum: 0.5
            maximum: 60.0
            default: 5.0
          description: |
            Request-level wall-clock budget (seconds). When exceeded
            the walker stops, the response sets
            `_truncated_by_deadline=true`, and `_lines_scanned`
            reports how many non-empty lines were examined. Caps
            no-match pathological regex cost; required because `limit`
            only caps matches, not scanned lines (PR #2062 round 4).
      responses:
        "200":
          description: Matching events, capped at `limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditGrepResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /audit/stats:
    get:
      tags: [Audit]
      operationId: statsAudit
      summary: Aggregate counts of audit events by type and severity
      description: |
        Aggregates over the same target-file set the grep endpoint
        uses, so totals + per-event / per-severity counts match what
        a manual grep would produce. `severity` maps to the audit
        record's `status` field (`ok` / `warn` / `error`).

        `since` is REQUIRED on the HTTP surface — unbounded
        full-history scans across every rotated `.gz` archive can
        block the API worker for an arbitrary length of time. Use
        the CLI (`pm audit grep`) when an operator explicitly wants
        whole-history aggregation. (Codex P0 finding, PR #2062
        round 2.)

        `deadline_seconds` (default 10.0) imposes a request-level
        wall-clock cap on top of the `since` semantic bound, because
        the walker still reads every target file/line until it parses
        `ts` and filters. When exceeded, the response sets
        `_truncated_by_deadline=true` and `_lines_scanned` reports
        how far the walker got across live + rotated logs. (Codex
        P0 finding, PR #2062 round 6.)
      parameters:
        - in: query
          name: project
          schema: { type: string }
        - in: query
          name: since
          required: true
          schema: { type: string }
          description: |
            REQUIRED. ISO-8601 or shortcut (`1h` / `24h` / `7d`).
        - in: query
          name: deadline_seconds
          schema:
            type: number
            format: float
            minimum: 0.5
            maximum: 120.0
            default: 10.0
          description: |
            Request-level wall-clock budget (seconds). Default 10.0.
            Stats has a higher default than `/audit/grep` (5.0)
            because aggregation has no early-exit on match-count.
            When exceeded the walker stops, the response sets
            `_truncated_by_deadline=true`, and `_lines_scanned`
            reports how many non-empty lines were examined
            (PR #2062 round 6).
      responses:
        "200":
          description: Aggregate counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditStatsResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /briefings:
    get:
      tags: [Briefings]
      operationId: listBriefingTypes
      summary: List available briefing types
      description: |
        Returns every briefing type registered with the local registry.
        Each entry includes an `available` flag — false when the type
        is wired in but its provider plugin (e.g. `morning_briefing`)
        is not loaded in this `pm serve` instance.
      responses:
        "200":
          description: Briefing-type registry snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingTypesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /briefings/{type_name}:
    parameters:
      - in: path
        name: type_name
        required: true
        schema: { type: string }
        description: |
          Briefing type identifier from `GET /briefings`. Built-in
          types: `morning`.
    get:
      tags: [Briefings]
      operationId: renderBriefing
      summary: Render the most recently generated briefing of this type
      description: |
        Returns the cached briefing body (markdown + metadata) for the
        latest run. 404 when nothing has been generated yet; 503 when
        the provider plugin is not loaded.
      responses:
        "200":
          description: Cached briefing body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Provider plugin not loaded for this briefing type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /briefings/{type_name}/regenerate:
    parameters:
      - in: path
        name: type_name
        required: true
        schema: { type: string }
        description: Briefing type identifier from `GET /briefings`.
      - in: query
        name: timeout_seconds
        required: false
        schema: { type: number, minimum: 1, maximum: 600, default: 30 }
        description: |
          Sync regenerate budget in seconds. On overrun the request
          returns `504 timeout` (spec §2.7); the in-flight regenerate
          runs to completion in the background.
    post:
      tags: [Briefings]
      operationId: regenerateBriefing
      summary: Force regenerate a briefing (sync)
      description: |
        Runs the regenerate pipeline (gather → synthesize → emit) and
        returns the freshly produced body. Sync only in Phase 2;
        `?async=true` + a job registry is deferred to Phase 2.5.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegenerateBriefingRequest"
      responses:
        "200":
          description: Freshly regenerated briefing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BriefingResponse"
        "400":
          description: |
            Bad request — currently emitted in two shapes:
              * `body.project` was an empty / whitespace-only string.
              * `type_name` is `morning` and the caller passed
                `body.project`. Project-scoped morning briefings are
                not yet implemented (morning is always whole-workspace).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A regenerate for this `(type, project)` scope is already
            running on the shared executor; retry after it completes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Provider plugin not loaded or regenerate failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: |
            Sync regenerate exceeded `timeout_seconds`. The request
            returns immediately; the worker thread keeps running on
            the shared executor so retries (after the run finishes)
            do not duplicate work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer token from `~/.pollypm/api-token`. Generated on first
        `pm serve` startup; rotated via `pm api regen-token`. Always
        accepted. See `docs/web-api-spec.md` §3.
    cookieAuth:
      type: apiKey
      in: cookie
      name: pollypm-session
      description: |
        Session cookie minted by `GET /ui/` for loopback peers,
        verified tailnet peers (when `tailnet_trust_enabled=True`), or
        callers presenting a valid bearer header. The cookie is an
        opaque per-browser session value signed with the current API
        token; the raw bearer token is not stored in the cookie. LAN
        clients receive HTML without `Set-Cookie` and 401 on the first
        API call. See `docs/web-api-spec.md` §3.

  parameters:
    ProjectKey:
      in: path
      name: key
      required: true
      schema: { type: string }
      description: Project key (slug).
    ProjectKey2:
      in: path
      name: project
      required: true
      schema: { type: string }
      description: Project key (slug).
    TaskNumber:
      in: path
      name: n
      required: true
      schema: { type: integer, minimum: 1 }
      description: Task number within the project (per-project sequence).
    InboxId:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Inbox item identifier.
    ChatSessionName:
      in: path
      name: session_name
      required: true
      schema: { type: string }
      description: |
        Chat surface identifier from `GET /chat/sessions` — e.g.
        `operator`, `architect_<project>`, `advisor_<project>`,
        `task-<project>-<n>`.
    SessionName:
      in: path
      name: name
      required: true
      schema: { type: string }
      description: |
        Configured session name from `[sessions]` config — e.g.
        `operator`, `advisor_<project>`, `architect_<project>`. Per-task
        worker sessions are NOT addressable here; use the chat surface
        for those.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
      description: |
        Optional client-supplied key. **No server-side replay cache is
        wired today** — the header is accepted on the
        task-state endpoints (approve / reject / queue) so clients
        can start sending it from day one, but retries are NOT
        deduplicated yet. A real replay store is deferred to a later
        phase. Inbox-write endpoints intentionally do NOT accept this
        header (their backing operations are not idempotent — sending
        the header would imply a guarantee we cannot keep — see #2060).

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value:
                error:
                  code: unauthorized
                  message: Bearer token required
    InvalidRequest:
      description: Malformed body or query parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Body shape valid but values failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Concurrent write conflict; state changed between read and write.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: |
        Backing store unavailable (work-service / pg for inbox + task
        writes, or state.db / pollypm.toml for project + config writes).
        Returned with error code `service_unavailable`. Clients should
        retry shortly; persistent failures point at `pm doctor`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ---- Common -----------------------------------------------------
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable snake_case error code.
        message: { type: string }
        hint: { type: string }
        retry_after_seconds:
          type: integer
          minimum: 1
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ValidationErrorDetail:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"

    ActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }

    # ---- Health -----------------------------------------------------
    HealthResponse:
      type: object
      required: [status, version, schema_version, started_at, auth_mode, tailnet_trust_enabled]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: PollyPM package version.
        schema_version:
          type: integer
          description: Audit-log / DB schema version.
        started_at:
          type: string
          format: date-time
        auth_mode:
          type: string
          enum: [tailnet_trust, bearer_only]
          description: Authentication posture for this server process.
        tailnet_trust_enabled:
          type: boolean
          description: Whether Tailscale CGNAT peers are accepted without bearer or cookie credentials.

    DoctorCheck:
      type: object
      required: [name, status, message]
      properties:
        name: { type: string }
        status:
          type: string
          enum: [ok, warn, fail]
        message: { type: string }
        hint: { type: string }
    DoctorResponse:
      type: object
      required: [overall, checks]
      properties:
        overall:
          type: string
          enum: [ok, warn, fail]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheck"

    # Phase 2 §7 doctor surface schemas. Distinct from the legacy
    # ``DoctorCheck`` / ``DoctorResponse`` shapes above because Phase 2
    # mirrors the canonical ``pollypm.doctor.Check`` / ``CheckResult``
    # dataclasses field-for-field (severity, why, fix, fixable, etc.)
    # rather than collapsing to the ok/warn/fail summary the V1 endpoint
    # uses.
    DoctorCheckInfo:
      type: object
      required: [name, category, severity]
      properties:
        name: { type: string }
        category: { type: string }
        severity:
          type: string
          enum: [info, warning, error]
        description:
          type: string
          default: ""
        has_auto_fix:
          type: boolean
          default: false
    DoctorChecksResponse:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheckInfo"
    DoctorCheckResult:
      type: object
      required: [name, category, passed, skipped, severity]
      properties:
        name: { type: string }
        category: { type: string }
        passed: { type: boolean }
        skipped: { type: boolean }
        severity:
          type: string
          enum: [info, warning, error]
        status:
          type: string
          default: ""
        why:
          type: string
          default: ""
        fix:
          type: string
          default: ""
        fixable:
          type: boolean
          default: false
        has_auto_fix:
          type: boolean
          default: false
        data:
          type: object
          additionalProperties: true
    DoctorReportResponse:
      type: object
      required: [generated_at, duration_seconds, ok, passed, errors, warnings, skipped, checks]
      properties:
        generated_at:
          type: number
          description: Unix epoch seconds when the report was recorded.
        duration_seconds:
          type: number
        ok:
          type: boolean
          description: True iff the run produced no error-severity failures.
        passed:
          type: integer
        errors:
          type: integer
        warnings:
          type: integer
        skipped:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheckResult"
    DoctorRunRequest:
      type: object
      properties:
        check:
          type: string
          nullable: true
          description: Single check name to run. Omit / null to run every registered check.
        fix:
          type: boolean
          default: false
          description: When true, runs auto-fixes for failing checks and re-runs each fixed check to verify post-fix state.
    DoctorRunResponse:
      allOf:
        - $ref: "#/components/schemas/DoctorReportResponse"
        - type: object
          properties:
            fixes_applied:
              type: array
              description: One entry per attempted auto-fix; ``ok=true`` only when the fix handler succeeded (the post-fix re-run is reflected in the ``checks`` array).
              items:
                type: object
                required: [name, ok]
                properties:
                  name: { type: string }
                  ok: { type: boolean }
                  message:
                    type: string
                    default: ""

    # ---- Projects ---------------------------------------------------
    ProjectKind:
      type: string
      enum: [git, polyglot, monorepo, unknown]
      description: Detected project kind. Extends with new values; clients should treat unknown values as `unknown`.

    ProjectGlyph:
      type: string
      enum: [green, amber, red, paused, unknown]
      description: Stop-light signal derived from the briefing.

    TaskCounts:
      type: object
      additionalProperties:
        type: integer
      description: Map of TaskStatus value -> count.
      example:
        draft: 3
        queued: 1
        in_progress: 2
        review: 1
        done: 42

    Project:
      type: object
      required: [key, name, path, tracked, kind, glyph, task_counts, open_inbox_count, pending_plan_review]
      properties:
        key: { type: string }
        name: { type: string }
        path: { type: string, description: Filesystem path (server-local). }
        tracked: { type: boolean }
        kind:
          $ref: "#/components/schemas/ProjectKind"
        persona_name: { type: string }
        state:
          type: string
          description: Briefing-derived high-level state label.
        glyph:
          $ref: "#/components/schemas/ProjectGlyph"
        task_counts:
          $ref: "#/components/schemas/TaskCounts"
        open_inbox_count: { type: integer }
        pending_plan_review: { type: boolean }
        last_activity_at:
          type: string
          format: date-time
          nullable: true

    ProjectActivityEntry:
      type: object
      required: [ts, event, subject, actor]
      properties:
        ts: { type: string, format: date-time }
        event: { type: string }
        subject: { type: string }
        actor: { type: string }
        status: { type: string }
        summary: { type: string }

    # ---- Dashboard (Phase 2 §3) -------------------------------------
    SessionActivity:
      type: object
      required: [name, role, project, project_label, status, description, age_seconds]
      properties:
        name: { type: string }
        role: { type: string }
        project: { type: string }
        project_label: { type: string }
        status: { type: string }
        description: { type: string }
        age_seconds: { type: number, format: float }

    CommitInfo:
      type: object
      required: [hash, message, author, age_seconds, project]
      properties:
        hash: { type: string }
        message: { type: string }
        author: { type: string }
        age_seconds: { type: number, format: float }
        project: { type: string }

    CompletedItem:
      type: object
      required: [title, kind, project, age_seconds]
      properties:
        title: { type: string }
        kind:
          type: string
          description: |
            One of `issue`, `commit`, or `pr`. Open-ended — clients
            should treat unknown values like `issue`.
        project: { type: string }
        age_seconds: { type: number, format: float }

    InboxPreview:
      type: object
      required: [sender, title, project, task_id, age_seconds]
      properties:
        sender: { type: string }
        title: { type: string }
        project: { type: string }
        task_id: { type: string }
        age_seconds: { type: number, format: float }

    AccountQuotaUsage:
      type: object
      required: [account_name, provider, email, used_pct, summary, severity]
      properties:
        account_name: { type: string }
        provider: { type: string }
        email: { type: string }
        used_pct: { type: integer }
        summary: { type: string }
        severity: { type: string }
        limit_label:
          type: string
          default: limit
        reset_at:
          type: string
          description: |
            ISO-8601 timestamp string, or empty string when the
            provider does not expose a reset window.

    DashboardRollups:
      type: object
      description: |
        Aggregate counters mirrored from the cockpit rail. Under
        `?project=<key>` only the project-derived counters
        (`tracked_count`, `open_inbox_count`, `pending_plan_reviews`)
        are narrowed; `alert_count` and the three `*_24h` activity
        counters remain whole-system. The response envelope's
        `scoped_fields` list enumerates which fields the filter
        actually narrowed.
      required:
        - tracked_count
        - open_inbox_count
        - pending_plan_reviews
        - alert_count
        - sweep_count_24h
        - message_count_24h
        - recovery_count_24h
      properties:
        tracked_count: { type: integer }
        open_inbox_count: { type: integer }
        pending_plan_reviews: { type: integer }
        alert_count: { type: integer }
        sweep_count_24h: { type: integer }
        message_count_24h: { type: integer }
        recovery_count_24h: { type: integer }

    DashboardTokens:
      type: object
      required: [today, total]
      properties:
        today: { type: integer }
        total: { type: integer }

    DashboardResponse:
      type: object
      required:
        - generated_at
        - daemon_status
        - projects
        - rollups
        - active_sessions
        - recent_commits
        - completed_items
        - recent_messages
        - tokens
        - account_usages
      properties:
        generated_at: { type: string, format: date-time }
        daemon_status:
          type: string
          description: |
            `up` (active sessions present anywhere in the system) or
            `down` (no active sessions / supervisor unreachable).
            Always derived from the unfiltered gather result —
            `?project=` does NOT influence this field, so callers
            polling per-project still see the true daemon health. Per
            spec §3.3, a down daemon is a normal operating mode, not a
            503.
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        rollups:
          $ref: "#/components/schemas/DashboardRollups"
        scoped_fields:
          type: array
          description: |
            Names of response fields actually narrowed by `?project=`.
            Empty when no filter is in effect. Lets clients tell which
            counters reflect the requested project vs which remain
            whole-system (see `DashboardRollups` for why the four
            activity counters stay global).
          items:
            type: string
        active_sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionActivity"
        recent_commits:
          type: array
          items:
            $ref: "#/components/schemas/CommitInfo"
        completed_items:
          type: array
          items:
            $ref: "#/components/schemas/CompletedItem"
        recent_messages:
          type: array
          items:
            $ref: "#/components/schemas/InboxPreview"
        tokens:
          $ref: "#/components/schemas/DashboardTokens"
        account_usages:
          type: array
          items:
            $ref: "#/components/schemas/AccountQuotaUsage"
        daily_tokens:
          type: array
          description: |
            Optional `[date, tokens]` pairs (last 30 days). Only
            populated when `?include_token_history=true`.
          items:
            type: array
            minItems: 2
            maxItems: 2
            prefixItems:
              - type: string
              - type: integer
        briefing:
          type: string
          description: |
            Optional morning-briefing narrative. Only populated when
            `?include_briefing=true`.

    ProjectDrilldown:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [recent_activity, top_tasks]
          properties:
            recent_activity:
              type: array
              items:
                $ref: "#/components/schemas/ProjectActivityEntry"
            top_tasks:
              type: array
              items:
                $ref: "#/components/schemas/TaskSummary"
            plan_review:
              $ref: "#/components/schemas/Plan"

    RegisterProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute filesystem path to the project repository.
        name:
          type: string
          description: Display name. Defaults to repo directory name.
        slug:
          type: string
          description: |
            Optional canonical slug. Must match
            `slugify_project_key()` rules; rejected with
            `validation_error` otherwise.
        tracked:
          type: boolean
          default: true

    ProjectReasonRequest:
      type: object
      description: |
        Body for `POST /projects/{key}/pause` and
        `POST /projects/{key}/archive`. `reason` is persisted to the
        per-project audit log (`projects.tracked.set` /
        `projects.archive` events) along with the actor and timestamp.
        Clamped to 500 chars.
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Optional operator-supplied note. Persisted to the per-
            project audit log (`projects.tracked.set` /
            `projects.archive` events) along with the actor and
            timestamp. Clamped to 500 chars.

    InitGuideRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [architect, reviewer, worker]
          description: |
            Which role-specific guide to seed. The `operator_pm` role
            is intentionally excluded — Polly always uses the built-in
            operator guide.
        force:
          type: boolean
          default: false
          description: |
            Overwrite an existing guide. Without this, existing
            guides return `409 conflict`.

    InitGuideResponse:
      type: object
      required: [role, path, body]
      properties:
        role:
          type: string
          description: Normalized role name (matches `role` in the request).
        path:
          type: string
          description: |
            Filesystem path of the written guide (server-local).
        forked_from:
          type: string
          description: |
            Fork-reference for the built-in template the guide was
            seeded from. Used by the drift detector to flag when the
            upstream template has moved.
        body:
          type: string
          description: |
            The rendered guide body (without front-matter). Clients
            can preview the seeded text without a follow-up GET.

    PlanRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [initial, replan]
          default: initial
        reason:
          type: string
          description: Required when `kind=replan`.
    PlanKickoffAccepted:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string, description: "Plan task id (project/N)." }
        status:
          type: string
          enum: [accepted]

    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string }
        thread_id:
          type: string
          description: Continue an existing thread when present.
    ChatAccepted:
      type: object
      required: [thread_id, status]
      properties:
        thread_id: { type: string }
        status:
          type: string
          enum: [accepted]

    # ---- Chat GET endpoints (P2 — discovery + history) --------------
    ChatSurfaceType:
      type: string
      enum: [operator, architect, advisor, worker]
      description: Persona category for a chat surface.

    ChatSurfaceWindow:
      type: object
      required: [tmux_session, window_name, present, pane_dead]
      properties:
        tmux_session: { type: string }
        window_name: { type: string }
        present:
          type: boolean
          description: True when the tmux window is currently running.
        pane_id: { type: string }
        pane_dead:
          type: boolean
          description: True when the pane is registered but its process exited.

    ChatSurfaceTranscript:
      type: object
      properties:
        source:
          type: string
          nullable: true
          enum: [jsonl, null]
          description: |
            `jsonl` when an `events.jsonl` archive exists for this
            surface; `null` for brand-new surfaces that haven't been
            written to yet (spec §4.8). The discovery endpoint never
            probes tmux — capture availability is decided by the
            history endpoint.
        path:
          type: string
          nullable: true
          description: Filesystem path to the archive when `source=jsonl`.

    ChatSurface:
      type: object
      required: [session_name, surface_type, window, transcript,
                 provider, auth_token_present]
      properties:
        session_name: { type: string }
        surface_type:
          $ref: "#/components/schemas/ChatSurfaceType"
        persona:
          type: string
          nullable: true
        project:
          type: string
          nullable: true
        task_id:
          type: integer
          nullable: true
          description: Per-task worker surfaces only.
        window:
          $ref: "#/components/schemas/ChatSurfaceWindow"
        transcript:
          $ref: "#/components/schemas/ChatSurfaceTranscript"
        cwd:
          type: string
          nullable: true
        provider: { type: string }
        auth_token_present: { type: boolean }
        worktree_path:
          type: string
          nullable: true

    ChatSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSurface"

    ChatMessageRole:
      type: string
      enum: [user, assistant, system, tool]

    ChatMessageType:
      type: string
      description: |
        Envelope discriminator per spec §3. Mirrors the HTTP-public
        runtime `MessageType` enum at
        `src/pollypm/web_api/chat/envelope.py` —
        `tests/web_api/test_openapi_conformance.py::test_chat_message_type_enum_matches_runtime`
        asserts set equality so future drift trips CI.

        `thinking` envelopes carry Anthropic extended-thinking blocks
        and are only emitted when the request opts in via
        `?include_thinking=true` (default: false). See issues #2048 /
        #2082.
      enum:
        - text
        - tool_use
        - tool_result
        - ask_user
        - file
        - subagent_spawn
        - subagent_result
        - system_event
        - thinking
        - synthetic_notice

    ChatMessageEnvelope:
      type: object
      required: [id, ts, role, actor, type, text, metadata]
      properties:
        id:
          type: string
          description: Stable per-archive envelope id (used as cursor).
        ts:
          type: string
          description: ISO-8601 timestamp.
        role:
          $ref: "#/components/schemas/ChatMessageRole"
        actor:
          type: string
          description: Persona / actor name (falls back to `agent` / `worker`).
        type:
          $ref: "#/components/schemas/ChatMessageType"
        text: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: |
            Type-dependent payload. `subagent_result` envelopes carry
            `output_file` and `summary`; when the request passes
            `include_subagents=true`, they also carry
            `subagent_transcript` — a list of envelopes parsed from
            the raw Claude subagent JSONL referenced by `output_file`
            (allowlist-constrained, capped per envelope). See #2052.
            `synthetic_notice` envelopes are ingestor-generated stubs
            and carry `metadata.synthetic=true` with
            `metadata.model="<synthetic>"`; clients should render them
            as notice/banner content, not as assistant speech.

    ChatMessagesResponse:
      type: object
      required: [session_name, surface_type, messages, has_more]
      properties:
        session_name: { type: string }
        surface_type:
          $ref: "#/components/schemas/ChatSurfaceType"
        persona:
          type: string
          nullable: true
        transcript_source:
          type: string
          nullable: true
          enum: [jsonl, capture, null]
          description: |
            Which source the envelopes came from for this request —
            `jsonl` (archive), `capture` (live tmux), or `null` (no
            archive yet and capture unavailable).
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessageEnvelope"
        has_more:
          type: boolean
          description: True when more pages exist after `next_cursor`.
        next_cursor:
          type: string
          nullable: true
          description: |
            Pass back as `since_id` to fetch the next page. Applied
            in the same order as the previous response so `asc` and
            `desc` pagination both walk without duplicates.

    # ---- Chat POST endpoint (P3 — send) -----------------------------
    ChatSendSafety:
      type: string
      enum: [strict, loose, force]
      description: |
        Safety gate level.

        * `strict` (default): All safety gates active. Fails closed
          (409) when signals are unavailable as well as when they
          report unsafe:
          - `unsafe_mid_tool` — open tool_use in the latest assistant
            turn.
          - `unsafe_mid_stream` — heartbeat <2s old.
          - `unsafe_unavailable_transcript` — transcript file exists
            but can't be read (permissions, IO error). Mid-tool gate
            can't be evaluated; strict fails closed.
          - `unsafe_unavailable_heartbeat` — pg pool / heartbeat
            backing-store outage. Mid-stream gate can't be evaluated;
            strict fails closed.
        * `loose`: Mid-tool gate active. Mid-stream check is
          best-effort. Continues on unavailable signals and surfaces
          one of the following `X-PollyPM-Warning` response headers:
          `agent-may-be-streaming`, `heartbeat-unavailable`, or
          `transcript-unavailable`.
        * `force`: All safety gates bypassed. Pane and window
          validation (`pane_invalid`, `pane_dead`, `window_missing`,
          `tmux_unavailable`) is NOT bypassed.

    ChatSendRequest:
      type: object
      properties:
        text:
          type: string
          description: |
            Free-text body to send. Required when `selections` is
            empty and no `answer_to` is set.
        press_enter:
          type: boolean
          default: true
          description: Submit the buffer by pressing Enter after the text lands.
        answer_to:
          type: string
          description: |
            ID of an `ask_user` envelope in the session's transcript
            that this send answers. When set, `selections` must
            reference one of the question's option labels (§4.5).
        selections:
          type: array
          items: { type: string }
          description: |
            Selected option labels for an AskUserQuestion reply.
            Each entry must exactly match one of the question's
            option labels.
        notes:
          type: string
          description: |
            Optional free-text addition appended after `selections`
            when answering an `ask_user`. Ignored for plain text
            sends.
        safety:
          $ref: "#/components/schemas/ChatSendSafety"
        pane:
          type: integer
          minimum: 0
          description: |
            0-based pane index inside the target window. Defaults
            to the active pane. Validated against `tmux list-panes`
            — out-of-range indexes return `409 pane_invalid`; dead
            panes return `409 pane_dead`.

    ChatSendResponse:
      type: object
      required: [ok, message_id, session_name, window_target, characters_sent, method]
      properties:
        ok: { type: boolean }
        message_id:
          type: string
          description: Synthetic id for the send request (echoed for tracing).
        session_name: { type: string }
        window_target:
          type: string
          description: |
            `tmux` target the send was routed to
            (`<storage-closet>:<window>[.<pane>]`).
        characters_sent: { type: integer, minimum: 0 }
        method:
          type: string
          enum: [send_keys, paste_buffer]
          description: |
            `paste_buffer` is used automatically for bodies > 100
            characters; `send_keys` otherwise.
        press_enter_at:
          type: string
          nullable: true
          description: |
            ISO-8601 UTC timestamp of the Enter press, or null when
            `press_enter=false`.

    # ---- Tasks ------------------------------------------------------
    TaskStatus:
      type: string
      enum:
        - draft
        - queued
        - in_progress
        - rework
        - blocked
        - on_hold
        - review
        - done
        - cancelled

    TaskType:
      type: string
      enum: [epic, task, subtask, bug, spike]

    TaskPriority:
      type: string
      enum: [critical, high, normal, low]

    TaskSummary:
      type: object
      required: [task_id, project, task_number, title, work_status, type, priority]
      properties:
        task_id: { type: string }
        project: { type: string }
        task_number: { type: integer }
        title: { type: string }
        work_status:
          $ref: "#/components/schemas/TaskStatus"
        type:
          $ref: "#/components/schemas/TaskType"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assignee: { type: string }
        claimed_by_session: { type: string }
        current_node_id: { type: string }
        plan_version: { type: integer }
        created_at:
          type: string
          format: date-time
          description: Task creation timestamp.
        state_entered_at:
          type: string
          format: date-time
          nullable: true
          description: When the task entered its current work_status.
        dwell_seconds:
          type: integer
          nullable: true
          description: Seconds spent in the current work_status.
        age_seconds:
          type: integer
          nullable: true
          description: Seconds since task creation.
        updated_at: { type: string, format: date-time }

    Transition:
      type: object
      required: [from_state, to_state, actor, timestamp]
      properties:
        from_state: { type: string }
        to_state: { type: string }
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        reason: { type: string }

    Artifact:
      type: object
      required: [kind, description]
      properties:
        kind:
          type: string
          enum: [commit, file_change, action, note]
        description: { type: string }
        ref: { type: string }
        path: { type: string }
        external_ref: { type: string }

    WorkOutput:
      type: object
      required: [type, summary]
      properties:
        type:
          type: string
          enum: [code_change, action, document, mixed]
        summary: { type: string }
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"

    FlowNodeExecution:
      type: object
      required: [task_id, node_id, visit, status]
      properties:
        task_id: { type: string }
        node_id: { type: string }
        visit: { type: integer }
        status:
          type: string
          enum: [pending, active, blocked, completed, abandoned]
        decision:
          type: string
          enum: [approved, rejected]
        decision_reason: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        work_output:
          $ref: "#/components/schemas/WorkOutput"

    ContextEntry:
      type: object
      required: [actor, timestamp, text, entry_type]
      properties:
        actor: { type: string }
        timestamp: { type: string, format: date-time }
        text: { type: string }
        entry_type:
          type: string
          enum: [note, reply, read]

    TaskRelationships:
      type: object
      properties:
        parent: { type: string, description: "Parent task id (project/N) or null." }
        children:
          type: array
          items: { type: string }
        blocks:
          type: array
          items: { type: string }
        blocked_by:
          type: array
          items: { type: string }
        relates_to:
          type: array
          items: { type: string }
        supersedes: { type: string }
        superseded_by: { type: string }

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          required: [description, transitions, executions, relationships]
          properties:
            description: { type: string }
            acceptance_criteria: { type: string }
            constraints: { type: string }
            labels:
              type: array
              items: { type: string }
            relevant_files:
              type: array
              items: { type: string }
            relationships:
              $ref: "#/components/schemas/TaskRelationships"
            flow_template_id: { type: string }
            flow_template_version: { type: integer }
            requires_human_review: { type: boolean }
            predecessor_task_id: { type: string }
            transitions:
              type: array
              items:
                $ref: "#/components/schemas/Transition"
            executions:
              type: array
              items:
                $ref: "#/components/schemas/FlowNodeExecution"
            context:
              type: array
              items:
                $ref: "#/components/schemas/ContextEntry"
            external_refs:
              type: object
              additionalProperties: { type: string }
            total_input_tokens: { type: integer }
            total_output_tokens: { type: integer }
            session_count: { type: integer }
            created_by: { type: string }
            plan:
              $ref: "#/components/schemas/Plan"
              description: Populated only when this task is a plan task at review.

    TaskListResponse:
      type: object
      required: [items, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskSummary"
        total:
          type: integer
          minimum: 0
          description: Total matching tasks before pagination.
        has_more:
          type: boolean
          description: True when `next_cursor` can fetch another page.
        next_cursor:
          type: string
          description: Absent when no more pages.
        warnings:
          type: array
          description: |
            Per-project partial-failure notices and tracked-scope
            filtering notices. Absent/empty when every project read
            succeeded and no matching rows were omitted.
          items:
            $ref: "#/components/schemas/TaskListWarning"

    TaskListWarning:
      oneOf:
        - $ref: "#/components/schemas/TaskListPartialFailureWarning"
        - $ref: "#/components/schemas/TaskListFilteredWarning"

    TaskListPartialFailureWarning:
      type: object
      required: [project, error]
      properties:
        project:
          type: string
          description: Project key whose backing store failed.
        error:
          type: string
          description: |
            Short error code (e.g. `service_unavailable`). Stable across
            releases so clients can switch on it.

    TaskListFilteredWarning:
      type: object
      required: [code, dropped_count, reason]
      properties:
        code:
          type: string
          enum: [untracked_filtered]
        dropped_count:
          type: integer
          minimum: 1
          description: Number of matching task rows omitted by the tracked-project scope.
        reason:
          type: string
          enum: [untracked_projects]

    ApproveRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [plan, code_review, auto]
          default: auto
          description: |
            `auto` (default) approves whichever review is active.
            `plan` and `code_review` are explicit and reject with
            `invalid_state` if that review type is not active.
        note:
          type: string
          description: Optional approval note recorded on the execution.

    RejectRequest:
      type: object
      required: [reason]
      properties:
        kind:
          type: string
          enum: [plan, code_review, auto]
          default: auto
        reason:
          type: string
          minLength: 1

    TaskClaimRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: |
            Session-level claimant identity recorded as
            `claimed_by_session`. The work-service derives the
            resulting `assignee` from the task's flow + roles when
            applicable.
      description: |
        `additionalProperties: false` mirrors the runtime
        `TaskClaimRequest` model (`extra="forbid"` in
        `src/pollypm/web_api/models.py`). Unknown keys — including
        `assignee` (spec §5.3 mentions it, but this endpoint derives
        the assignee from the work-service; use `/reassign` instead)
        — surface as a `422 validation_error` from the request
        validator instead of being silently dropped (#2064 round-12).

    TaskCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: |
            Optional explanation; absent reasons collapse to
            "cancelled via API" in the audit row.
      description: |
        `additionalProperties: false` mirrors the runtime
        `TaskCancelRequest` model (`extra="forbid"` in
        `src/pollypm/web_api/models.py`). Unknown keys surface as a
        `422 validation_error` instead of being silently dropped
        (#2064 round-12).

    TaskReopenRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          description: |
            Optional explanation; absent reasons collapse to
            "reopened via API" in the audit row.

    TaskReleaseRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: Operator identity recorded on the release transition.
        reason:
          type: string
          description: |
            Optional explanation; absent reasons collapse to
            "released via API" in the audit row.
      description: |
        `additionalProperties: false` mirrors the runtime
        `TaskReleaseRequest` model (`extra="forbid"` in
        `src/pollypm/web_api/models.py`). Unknown keys surface as a
        `422 validation_error` instead of being silently dropped.

    TaskReassignRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: |
            New assignee. Updates the `assignee` column AND appends a
            work-context breadcrumb (entry_type `reassignment`) noting
            the old→new transition. Both mutations land in a single
            transaction; concurrent reassigns serialize via
            `SELECT ... FOR UPDATE`. No state-machine transition
            fires (`work_status` unchanged).
      description: |
        `additionalProperties: false` mirrors the runtime
        `TaskReassignRequest` model (`extra="forbid"` in
        `src/pollypm/web_api/models.py`). Unknown keys surface as a
        `422 validation_error` instead of being silently dropped
        (#2064 round-12).

    # Lifecycle REST verbs (#2137) — each mirrors the existing
    # TaskClaimRequest shape: required `actor`, optional verb-specific
    # extras, `additionalProperties: false` so misspelled keys surface
    # as 422 instead of being silently dropped.

    TaskDoneRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: Operator identity recorded on the done transition.

    TaskApproveRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: Reviewer identity recorded on the approval transition.
        reason:
          type: string
          description: Optional approval rationale.

    TaskHoldRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: Operator identity recorded on the hold transition.
        reason:
          type: string
          description: Optional hold reason.

    TaskReworkRequest:
      type: object
      additionalProperties: false
      required: [actor, reason]
      properties:
        actor:
          type: string
          minLength: 1
          description: Reviewer identity recorded on the rejection.
        reason:
          type: string
          minLength: 1
          description: |
            Required rejection rationale; the work-service refuses an
            empty reason at `svc.reject(...)`. The request validator
            also enforces `minLength: 1` so a missing reason surfaces
            as 422 from the validator.

    TaskBlockRequest:
      type: object
      additionalProperties: false
      required: [actor, blocker_task_id]
      properties:
        actor:
          type: string
          minLength: 1
          description: Operator identity recorded on the block transition.
        blocker_task_id:
          type: string
          minLength: 1
          description: |
            ID of the task this one is blocked on (`project/n` form).
            The work-service inserts a `blocks` dependency edge and
            flips the task's status to `blocked`.

    TaskReviewRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: |
            Operator identity recorded on the transition. Forces an
            `in_progress` (or `rework`) task into `review` without
            requiring a flow `work_output` payload.

    TaskInProgressRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          type: string
          minLength: 1
          description: |
            Operator identity recorded on the transition. Forces a
            non-terminal task into `in_progress`. `on_hold` callers
            should normally use `/resume`-style flows; this endpoint
            is the explicit override (#2137).

    TaskPatchRequest:
      type: object
      additionalProperties: false
      description: |
        Partial-update body. Every field is optional; only fields
        present in the body are written. Lists replace, not merge
        (spec §5.4).

        `additionalProperties: false` mirrors the runtime
        `TaskPatchRequest` model (`extra="forbid"` in
        `src/pollypm/web_api/models.py`). Unknown keys — typos like
        `metdata` or unsupported fields like `priority` / `assignee`
        — surface as a `422 validation_error` from the request
        validator instead of being silently dropped. Generated
        clients reading this schema see the same contract the
        server enforces.
      properties:
        labels:
          type: array
          items: { type: string }
          description: |
            Replacement label set. Pass `[]` to clear. Pass `null`
            (i.e. omit the key) to leave labels untouched.
        status:
          type: string
          description: |
            Target work-status. Only `queued` and `cancelled` are
            routed via PATCH (mapped to `svc.queue` / `svc.cancel`);
            other statuses raise `422 validation_error` with a hint
            pointing to the dedicated transition endpoint.
        metadata:
          type: object
          additionalProperties: { type: string }
          description: |
            Free-form per-task key/value map. Stored as the task's
            `external_refs` column.

    TaskActionResult:
      type: object
      required: [ok, task]
      description: |
        Mutation envelope for the task transition / edit endpoints
        (spec §5.3). Carries the post-mutation `TaskDetail` so the
        client refreshes its UI without a follow-up `GET`.
      properties:
        ok:
          type: boolean
        message:
          type: string
          description: Operator-facing summary; clients should not parse it.
        task:
          $ref: "#/components/schemas/TaskDetail"
        warnings:
          type: array
          default: []
          items:
            type: string
          description: |
            Operator-facing warnings about side effects of the
            transition that did NOT fail the request (#2064
            round-10). Today this is populated by the claim path
            to surface `last_provision_error` when the DB claim
            committed but the per-task worker session could not
            be provisioned (tmux/worktree/cap failures), and to
            surface SessionManager wire-up failures. Each entry
            includes recovery wording (hold + resume) matching
            the CLI's `pm task claim` stderr warning. Empty on
            the happy path; clients can branch on
            `len(warnings) > 0` to render a banner alongside the
            now-`in_progress` task.

    # ---- Plan -------------------------------------------------------
    PlanJudgmentCall:
      type: object
      required: [point]
      properties:
        point:
          type: string
          description: One judgment-call bullet from the architect.

    Plan:
      type: object
      required: [task_id, version, summary, judgment_calls, body, created_at]
      properties:
        task_id: { type: string }
        version: { type: integer, minimum: 1 }
        predecessor_task_id: { type: string }
        summary: { type: string }
        judgment_calls:
          type: array
          items:
            $ref: "#/components/schemas/PlanJudgmentCall"
        body:
          type: string
          description: Full plan markdown.
        critic_synthesis:
          type: string
          description: Architect critic notes; nullable.
        created_at: { type: string, format: date-time }

    # ---- Inbox ------------------------------------------------------
    InboxItemType:
      type: string
      description: |
        Open enumeration. Known values include `message`,
        `plan_review`, `blocking_question`, `alert`, and the structured
        inbox `kind` values persisted on work tasks. Clients should treat
        unknown values as `message`.
      enum:
        - message
        - plan_review
        - blocking_question
        - alert
        - plan_review_pending
        - approval_request
        - pm_question_unanswered
        - watchdog_operator_dispatch
        - manual_decision
        - completion_fyi
        - self_bug_report
        - activity_event
        - info
        - legacy

    InboxItemState:
      type: string
      enum:
        - open
        - threaded
        - waiting-on-pa
        - waiting-on-pm
        - resolved
        - closed

    InboxOwner:
      type: string
      enum: [pm, pa, worker, operator]

    InboxItem:
      type: object
      required: [id, project, type, state, subject, owner, created_at, updated_at]
      properties:
        id: { type: string }
        project: { type: string }
        type:
          $ref: "#/components/schemas/InboxItemType"
        state:
          $ref: "#/components/schemas/InboxItemState"
        subject: { type: string }
        preview: { type: string, description: Short preview of the body. }
        owner:
          $ref: "#/components/schemas/InboxOwner"
        thread_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
          description: |
            Sidecar fields. For `plan_review` items this includes
            `task_id`, `judgment_calls` (string array), and a plan
            preview.

    InboxMessage:
      type: object
      required: [id, sender, timestamp, body]
      properties:
        id: { type: string }
        sender:
          type: string
          description: "`operator`, `pm`, `pa`, or worker session name."
        timestamp: { type: string, format: date-time }
        body: { type: string }

    InboxItemDetail:
      allOf:
        - $ref: "#/components/schemas/InboxItem"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/InboxMessage"

    InboxListResponse:
      type: object
      required: [items, total, has_more, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxItem"
        total:
          type: integer
          minimum: 0
          description: Total matching inbox items before pagination.
        has_more:
          type: boolean
          description: True when `next_cursor` can fetch another page.
        unread_count:
          type: integer
          minimum: 0
          description: Matching inbox items without a persisted read marker.
        next_cursor: { type: string }

    InboxReplyRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
        owner:
          $ref: "#/components/schemas/InboxOwner"

    InboxArchiveRequest:
      type: object
      properties:
        reason:
          type: string
          description: |
            Optional operator-supplied reason for archiving; recorded
            as a best-effort context note AFTER the strict archive
            transition succeeds. If the transition fails (e.g.
            concurrent archive, invalid state, backing-store outage),
            no note is persisted.

    InboxSnoozeRequest:
      type: object
      description: |
        Exactly one of `duration_seconds` or `until` must be supplied.
        `until` must be < 30 days in the future.
      properties:
        duration_seconds:
          type: integer
          minimum: 1
        until:
          type: string
          format: date-time
        reason:
          type: string

    InboxPromoteRequest:
      type: object
      description: |
        Optional overrides for the new task. ``project`` defaults to
        the source item's project; ``prompt`` defaults to the source
        item's description / subject; ``title`` defaults to
        "From inbox: <source-title>".
      properties:
        project:
          type: string
        prompt:
          type: string
        title:
          type: string

    InboxMarkReadRequest:
      type: object
      properties:
        actor:
          type: string
          description: Actor to record on the read marker (default `api`).

    # ---- Events -----------------------------------------------------
    Event:
      type: object
      required: [schema, ts, project, event, subject, actor, status]
      properties:
        schema:
          type: integer
          description: Audit-log schema version (currently 1).
        ts:
          type: string
          format: date-time
        project: { type: string }
        event:
          type: string
          description: |
            Stable `noun.verb` event name. Examples: `task.created`,
            `task.status_changed`, `plan.version_incremented`,
            `plan.successor_created`, `worker.session_reaped`,
            `watchdog.escalation_dispatched`, `socket.reaped`,
            `work_db.opened`.
        subject:
          type: string
          description: Resource id the event is about (e.g. `pollypm/142`).
        actor: { type: string }
        status: { type: string }
        metadata:
          type: object
          additionalProperties: true
      example:
        schema: 1
        ts: "2026-05-07T12:01:33.022Z"
        project: pollypm
        event: task.status_changed
        subject: pollypm/142
        actor: pm
        status: done
        metadata: {}

    # ---- Config (Phase 2 §13, read-only) ----------------------------
    ConfigView:
      type: object
      required: [config]
      properties:
        config:
          type: object
          additionalProperties: true
          description: |
            Redacted snapshot of the loaded `PollyPMConfig`. Shape is
            open-ended (the underlying dataclass grows over time);
            credential-shaped fields are replaced with `"***"`, paths
            are strings, enums are their `.value`.
    ProjectConfigView:
      type: object
      required: [key, project]
      properties:
        key:
          type: string
          description: Project key (slug) the config block belongs to.
        project:
          type: object
          additionalProperties: true
          description: |
            Redacted snapshot of the `[projects.<key>]` config block.

    # ---- Sessions admin (Phase 2 §10) -------------------------------
    SessionStatus:
      type: string
      enum: [healthy, stale, missing, unknown]
      description: |
        Live runtime-health classification mirroring `pm sessions`.
        `healthy` = heartbeat <=5min old AND tmux window present.
        `stale` = heartbeat older than 5min. `missing` = tmux window
        absent (beats `stale` — pane is the more urgent problem).
        `unknown` = no heartbeat row yet (fresh boot OR pg outage).

        Pause is NOT a value of this enum. The operator-set pause
        marker is exposed as the separate `SessionInfo.paused`
        boolean so a paused-but-missing or paused-but-stale session
        still reports its true runtime state. Folding pause into
        `status` was removed in PR #2061 round 2 because the
        marker is only PARTIALLY enforced today: the recovery loops
        (`no_session_spawn`, `Supervisor.maybe_recover_session`)
        honour it but the dispatch / cockpit / heartbeat loops do
        not yet (#2068). `status="paused"` would have masked the
        actual runtime classification for the loops that still act.

    SessionInfo:
      type: object
      required:
        - name
        - role
        - project
        - provider
        - account
        - window_name
        - tmux_session
        - window_present
        - status
        - auth_token_present
        - enabled
        - paused
      properties:
        name: { type: string }
        role:
          type: string
          description: |
            Session role from config — e.g. `operator-pm`, `architect`,
            `advisor`, `heartbeat-supervisor`.
        project: { type: string }
        provider:
          type: string
          description: Provider name (e.g. `claude`, `codex`).
        account: { type: string }
        window_name: { type: string }
        tmux_session:
          type: string
          description: Storage-closet tmux session that owns the window.
        window_present:
          type: boolean
          description: True iff the tmux window is currently visible.
        status:
          $ref: "#/components/schemas/SessionStatus"
        last_heartbeat_iso:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the most-recent heartbeat row, if any.
        last_heartbeat_age_seconds:
          type: integer
          nullable: true
          description: Age (in whole seconds) of the most-recent heartbeat.
        auth_token_present:
          type: boolean
          description: |
            Lever-2 (#2012) trust signal — true when this session
            carries an `auth_token` the watchdog can use to verify its
            own injections.
        enabled: { type: boolean }
        paused:
          type: boolean
          description: |
            Operator-intent marker set via POST
            /sessions/{name}/pause and cleared via POST
            /sessions/{name}/resume. Remains a separate boolean from
            `status`: the `status` field above is still the source of
            truth for runtime health — a paused-but-missing session
            reports `status="missing"` AND `paused=true`, not
            `status="paused"`.

            Partial enforcement today: the recovery loops
            (`no_session_spawn.auto_recover_no_session_alerts` and
            `Supervisor.maybe_recover_session`) honor this marker and
            skip respawn when set. The dispatch / cockpit / heartbeat
            loops do NOT yet consume it — that wiring is tracked under
            #2068.

    SessionsListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    SessionHealthSnapshot:
      type: object
      required: [window_present, pane_alive, pane_dead]
      properties:
        window_present: { type: boolean }
        pane_alive: { type: boolean }
        pane_dead: { type: boolean }
        pane_command:
          type: string
          nullable: true
          description: Foreground command of the pane (e.g. `claude`, `bash`).

    SessionConfigView:
      type: object
      required:
        - name
        - role
        - provider
        - account
        - project
        - cwd
        - window_name
        - enabled
        - auth_token_present
      properties:
        name: { type: string }
        role: { type: string }
        provider: { type: string }
        account: { type: string }
        project: { type: string }
        cwd:
          type: string
          description: Working directory the session was launched in.
        window_name: { type: string }
        enabled: { type: boolean }
        auth_token_present:
          type: boolean
          description: |
            True when `auth_token` is non-empty on disk. The token
            itself is never returned over the API.
        agent_profile:
          type: string
          nullable: true
        args:
          type: array
          items: { type: string }

    SessionDetail:
      type: object
      required: [info, config, health, is_turn_active]
      properties:
        info:
          $ref: "#/components/schemas/SessionInfo"
        config:
          $ref: "#/components/schemas/SessionConfigView"
        health:
          $ref: "#/components/schemas/SessionHealthSnapshot"
        is_turn_active:
          type: boolean
          description: |
            True when the agent appears to be mid-turn (provider-specific
            heuristic: Claude shows `⏺` / "Working"; Codex shows
            "working (...) esc to interrupt"). Used by POST
            /sessions/{name}/restart as the `unsafe_mid_turn` gate.

    # ---- Storage ----------------------------------------------------
    StorageEntry:
      type: object
      required: [name, files, bytes, cap_hit, note]
      description: |
        One row of the storage report — totals for a single `~/.pollypm/`
        subdir. When `cap_hit` is true, the scan stopped early at the
        50k-file safety cap (snapshots/ only today) and `files` / `bytes`
        are lower bounds.
      properties:
        name:
          type: string
          description: Subdir name (relative to `~/.pollypm/`).
        files:
          type: integer
          description: File count walked under this subdir (lower bound when `cap_hit`).
        bytes:
          type: integer
          description: Sum of file sizes in bytes (lower bound when `cap_hit`).
        oldest_mtime:
          type: string
          format: date-time
          nullable: true
        newest_mtime:
          type: string
          format: date-time
          nullable: true
        cap_hit:
          type: boolean
          description: True iff the scan stopped at the file-count cap.
        note:
          type: string
          description: Human-facing NOTES badge (unbounded-growth flag, orphan worktrees, audit rotation, etc.).

    StorageConfigFiles:
      type: object
      required: [files, bytes]
      description: |
        Rollup of top-level `~/.pollypm/*` config artifacts (TOML,
        `state.db`, `*.pid`, `errors.log`, etc.) — separated from the
        subdir rows so they don't distort sort order.
      properties:
        files: { type: integer }
        bytes: { type: integer }
        newest_mtime:
          type: string
          format: date-time
          nullable: true

    StorageReport:
      type: object
      required: [home, generated_at, total_files, total_bytes, subdirs, config_files]
      description: |
        Whole `~/.pollypm/` storage report. Mirrors the JSON form of
        `pm storage report` (#2040).
      properties:
        home:
          type: string
          description: Absolute path of the scanned home directory.
        generated_at:
          type: string
          format: date-time
        total_files:
          type: integer
        total_bytes:
          type: integer
        subdirs:
          type: array
          items:
            $ref: "#/components/schemas/StorageEntry"
        config_files:
          $ref: "#/components/schemas/StorageConfigFiles"

    # ---- Heartbeats -------------------------------------------------
    HeartbeatLatest:
      type: object
      required: [session_name, status]
      description: |
        Latest heartbeat snapshot for one session (Phase 2 §11.2).
        `last_tick_ts` / `age_seconds` are null when no row exists
        (status = `initializing`).
      properties:
        session_name: { type: string }
        role:
          type: string
          nullable: true
          description: Session role from config (e.g. `operator`, `architect`).
        project:
          type: string
          nullable: true
          description: Project key this session is bound to (when applicable).
        status:
          type: string
          enum: [healthy, stale, initializing, unknown]
          description: |
            `healthy` (≤5m), `stale` (>5m), `initializing` (no row yet),
            or `unknown` (row exists but timestamp unparseable).
        last_tick_ts:
          type: string
          format: date-time
          nullable: true
        age_seconds:
          type: integer
          nullable: true
        pane_command:
          type: string
          nullable: true
        pane_dead:
          type: boolean
          default: false
        log_bytes:
          type: integer
          default: 0
        snapshot_path:
          type: string
          nullable: true
        snapshot_hash:
          type: string
          nullable: true
        tmux_window:
          type: string
          nullable: true
        pane_id:
          type: string
          nullable: true

    HeartbeatTick:
      type: object
      required: [ts]
      description: |
        One raw heartbeat row from the per-session history table
        (Phase 2 §11.2). Returned newest-first by the detail endpoint.
      properties:
        ts:
          type: string
          format: date-time
        pane_command:
          type: string
          nullable: true
        pane_dead:
          type: boolean
          default: false
        log_bytes:
          type: integer
          default: 0
        snapshot_path:
          type: string
          nullable: true
        snapshot_hash:
          type: string
          nullable: true
        tmux_window:
          type: string
          nullable: true
        pane_id:
          type: string
          nullable: true

    HeartbeatsListResponse:
      type: object
      required: [heartbeats]
      properties:
        heartbeats:
          type: array
          items:
            $ref: "#/components/schemas/HeartbeatLatest"

    HeartbeatDetailResponse:
      type: object
      required: [latest, ticks, clamped]
      properties:
        latest:
          $ref: "#/components/schemas/HeartbeatLatest"
        ticks:
          type: array
          items:
            $ref: "#/components/schemas/HeartbeatTick"
        clamped:
          type: boolean
          description: |
            True when the caller's `?limit` exceeded the route's 200-row
            cap and was silently clamped (Phase 2 §11.3).

    # ---- Audit query (grep + stats) --------------------------------
    AuditGrepResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_cursor:
          type: string
          nullable: true
          description: |
            Reserved for cursor-paginated variants. Always `null`
            today; clients should accept and ignore the field.
        _malformed_rows_skipped:
          type: integer
          default: 0
          description: |
            Diagnostic counter. Non-zero when at least one archived
            row failed `Event` validation (typically a non-ISO `ts`
            from an old schema version) and was skipped rather than
            failing the response. (Codex P0 finding, PR #2062 round 2.)
        _pattern_timeouts:
          type: integer
          default: 0
          description: |
            Diagnostic counter. Non-zero when at least one line's regex
            search exceeded the per-line timeout (100 ms) and was
            skipped as a no-match. Always zero when `safe_regex=false`
            (the default literal-substring mode). Surfaced so operators
            running a deliberately exploratory regex can tell when the
            ReDoS guardrail fired vs. there genuinely being no matches.
            (Codex P0 finding, PR #2062 round 2.)
        _truncated_by_deadline:
          type: boolean
          default: false
          description: |
            `true` when the request-level wall-clock deadline
            (`deadline_seconds`) fired before the walker finished
            scanning every target file. Lets callers tell a
            complete-but-empty scan from a bounded-and-truncated one
            so they can re-run with a tighter filter or larger budget.
            (Codex P0 finding, PR #2062 round 4.)
        _lines_scanned:
          type: integer
          default: 0
          description: |
            How many non-empty lines the walker actually examined.
            Paired with `_truncated_by_deadline` so a truncated
            response reports how far it got across live + rotated
            logs. (Codex P0 finding, PR #2062 round 4.)
        _corrupt_archives_skipped:
          type: integer
          default: 0
          minimum: 0
          description: |
            Count of rotated `.gz` archives skipped during this query
            due to truncation, corruption, or read errors
            (`EOFError`, `gzip.BadGzipFile`, `zlib.error`). The query
            continues over the live log + other archives best-effort
            instead of letting the exception escape as a 500. Non-zero
            means at least one archive needs operator attention.
            (Codex round-7 finding, PR #2062.)

    AuditStatsResponse:
      type: object
      required: [total, by_event, by_severity]
      properties:
        total:
          type: integer
          description: Total events matching the project / since filters.
        by_event:
          type: object
          additionalProperties: { type: integer }
          description: Per-event-name counts.
        by_severity:
          type: object
          additionalProperties: { type: integer }
          description: |
            Per-severity counts. Severity values track the audit
            writer's `status` field (`ok` / `warn` / `error`).
        since:
          type: string
          format: date-time
          description: |
            Normalized cutoff the server applied — echoes whatever
            shortcut the client passed so it can confirm the
            interpretation.
        _truncated_by_deadline:
          type: boolean
          default: false
          description: |
            `true` when the request-level wall-clock deadline
            (`deadline_seconds`) fired before the walker finished
            scanning every target file. Distinguishes a complete
            aggregation from a bounded one so the caller can re-issue
            with a tighter project/since. (Codex P0 finding, PR #2062
            round 6.)
        _lines_scanned:
          type: integer
          default: 0
          description: |
            How many non-empty lines the walker actually examined.
            Paired with `_truncated_by_deadline` so a truncated
            response reports how far it got across live + rotated
            logs. (Codex P0 finding, PR #2062 round 6.)
        _corrupt_archives_skipped:
          type: integer
          default: 0
          minimum: 0
          description: |
            Same semantics as in `AuditGrepResponse`: count of rotated
            `.gz` archives skipped during this aggregation due to
            truncation, corruption, or read errors. Non-zero means at
            least one archive needs operator attention. (Codex round-7
            finding, PR #2062.)
        _malformed_rows_skipped:
          type: integer
          default: 0
          minimum: 0
          description: |
            Diagnostic counter mirroring `AuditGrepResponse`. Non-zero
            when at least one archived row failed the walker's `ts`
            parse gate (typically a non-ISO timestamp from an old
            schema version) and was skipped instead of inflating
            `total` / `by_event` / `by_severity`. Lets callers tell a
            clean aggregation from one where archived rows were
            silently dropped without having to cross-check via
            `/audit/grep`. (Codex round-9 finding, PR #2062.)

    # ---- Briefings --------------------------------------------------
    BriefingTypeInfo:
      type: object
      required: [name, description, available]
      properties:
        name:
          type: string
          description: |
            Stable identifier. Built-in: `morning`. Plugin-contributed
            types register additional names at startup.
        description:
          type: string
        available:
          type: boolean
          description: |
            True when the provider plugin is loaded. False means the
            type is wired in but cannot be rendered or regenerated.

    BriefingTypesResponse:
      type: object
      required: [types]
      properties:
        types:
          type: array
          items:
            $ref: "#/components/schemas/BriefingTypeInfo"

    BriefingResponse:
      type: object
      required: [type, markdown, metadata]
      properties:
        type:
          type: string
          description: Briefing-type identifier.
        generated_at:
          type: string
          format: date-time
          nullable: true
        date_local:
          type: string
          nullable: true
          description: Local date the briefing refers to (`YYYY-MM-DD`).
        mode:
          type: string
          nullable: true
          description: |
            Provider-specific render mode (e.g. `synthesized`, `fallback`,
            `quiet-mode` for the morning briefing).
        markdown:
          type: string
          description: The briefing body in Markdown.
        metadata:
          type: object
          additionalProperties: true
          description: |
            Provider-specific structured metadata: priorities, watch
            items, pinned flag, etc. Shape varies by briefing type.

    RegenerateBriefingRequest:
      type: object
      additionalProperties: false
      properties:
        project:
          type: string
          nullable: true
          description: |
            Optional project key narrowing the regenerate scope. The
            built-in `morning` type rejects this field with
            `400 invalid_request` — morning briefings are
            workspace-wide only. Plugin-contributed types may consume
            `project` for per-project scope; consult the type's docs.
