[project]
name = "pollypm"
version = "1.0.0rc3-dev"
description = "Tmux-first orchestration for interactive CLI coding agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0",
  # ``pm chat`` and ``pm sessions`` are first-class CLI surfaces that
  # talk to the local Web API over HTTP, so the HTTP client has to be a
  # runtime dependency — not a dev extra. Without this, ``pm --help``
  # crashes on a no-dev install because ``cli.py`` imports
  # ``chat_app`` unconditionally (#2047 packaging regression).
  "httpx>=0.27.0",
  "packaging>=23.0",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "textual>=6.1.0",
  "typer>=0.16.0",
  "uvicorn>=0.30.0",
  # Postgres is the only supported storage backend (#1737). Keeping
  # these as base ``dependencies`` (rather than an opt-in extra)
  # closes the "reinstall trap" (#1813, #1746) where
  # ``uv tool install --reinstall pollypm`` silently dropped the pg
  # driver and the cockpit crashed at first connection. pgvector
  # ships the psycopg type adapter for the recall path (Slice D).
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
  # httpx promoted to runtime dependency above (#2047) — it is no
  # longer dev-only now that ``pm chat`` ships in the base CLI.
  "openapi-spec-validator>=0.7.0",
  "pytest>=8.4.0",
  "ruff>=0.15.12",
  "testcontainers[postgres]>=4.8.0",
]
# #2043 review: a fresh ``uv run --with pytest`` collection of the
# Web API tests crashed because ``fastapi.testclient`` imports
# ``httpx`` and httpx wasn't a guaranteed test-time dep. The
# ``test`` extra mirrors the ``dev`` set down to the bits a CI
# matrix actually needs so reviewers can use
# ``uv run --extra test pytest`` and stay green.
test = [
  "httpx>=0.27.0",
  "pytest>=8.4.0",
]

[project.scripts]
pm = "pollypm.cli:app"
pollypm = "pollypm.cli:app"

# #1956: sqlite is intentionally NOT entry-pointed any more. The
# pg cutover (#1737) made postgres the production backend; leaving
# ``sqlite`` registered here let a misconfigured ``[storage].backend
# = "sqlite"`` silently open an empty sqlite shadow alongside the
# real pg state. ``get_store(config)`` now raises
# ``StoreBackendNotFound`` for ``backend == "sqlite"`` unless a
# caller has explicitly opted back in via
# :func:`pollypm.store.registry.register_backend` (tests, legacy
# ``--db <path>`` escape hatches). See ``store/registry.py``.
[project.entry-points."pollypm.store_backend"]
postgres = "pollypm.store.backends.pg_store:PgStore"

# Phase B (#397) — both providers extracted into their own packages.
# Phase A shipped the substrate (Protocol + registry + legacy shims);
# Phase C extracted Codex; Phase B extracts Claude. Third-party providers
# register by adding their own entry in this group via their own package.
[project.entry-points."pollypm.provider"]
claude = "pollypm.providers.claude:ClaudeProvider"
codex = "pollypm.providers.codex:CodexProvider"

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pollypm = [
  "model_registry.toml",
  "plugins_builtin/*/pollypm-plugin.toml",
  "plugins_builtin/*/profiles/*.md",
  "plugins_builtin/*/flows/*.yaml",
  "plugins_builtin/*/skills/*.md",
  "defaults/rules/*.md",
  "defaults/magic/*.md",
  "defaults/magic/*/*.md",
  "defaults/magic/*/**/*.md",
  "defaults/magic/*/**/*.html",
  "defaults/magic/*/**/*.sh",
  "defaults/magic/*/**/*.json",
  "defaults/magic/*/LICENSE",
  "defaults/docs/*.template",
  "defaults/docs/*.md",
  "defaults/docs/reference/*.md",
  "defaults/demo/*",
  "defaults/demo/**/*",
  "work/flows/*.yaml",
  "agents/*.md",
  # v0 web UI (Phase 7) — vanilla HTML/JS/CSS served by FastAPI
  # StaticFiles. No build step; ship the source files as-is.
  "web_api/ui/*.html",
  "web_api/ui/*.js",
  "web_api/ui/*.css",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "benchmark: performance benchmark tests (recall latency, etc.)",
  # #1737 Slice F / #1942: the ``work_service`` dispatch fixture in
  # ``tests/conftest.py`` reads this marker to decide whether a test
  # runs against ``PgWorkService`` (default after the #1942 flip),
  # ``SQLiteWorkService`` (legacy opt-in), or both. Usage:
  # ``@pytest.mark.backend('postgres')`` / ``('sqlite')`` / ``('both')``.
  # Unmarked tests run against pg; unknown values raise UsageError.
  "backend(name): pin a test to a work-service backend ('sqlite', 'postgres', or 'both')",
]
